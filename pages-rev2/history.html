<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>味一番つばさ 長期実績</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f4f7fb;color:#1f2937}header{background:#17365d;color:#fff;padding:14px 18px}header h1{margin:0 0 10px;font-size:21px}a{color:inherit}.nav{display:flex;gap:8px}.nav a{background:#4472c4;color:#fff;text-decoration:none;padding:10px 13px;border-radius:7px;font-weight:700}main{max-width:1400px;margin:auto;padding:16px}.notice{padding:12px;border-radius:9px;background:#fff2cc;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card,.panel{background:#fff;border-radius:11px;padding:14px;box-shadow:0 1px 6px #ccd}.label{font-size:13px;color:#64748b}.big{font-size:24px;font-weight:800;color:#17365d;margin-top:4px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border:1px solid #d9e2f3;text-align:right;white-space:nowrap}th{background:#4472c4;color:#fff;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.scroll{max-height:700px;overflow:auto}.neg{color:#b91c1c;font-weight:700}.pos{color:#15803d;font-weight:700}.bar{height:18px;background:#dbeafe;border-radius:5px;overflow:hidden;margin:6px 0}.fill{height:100%;background:#4472c4}.sub{font-size:12px;color:#64748b}.insight{border-left:5px solid #4472c4;padding:9px 12px;background:#f8fafc;margin:8px 0}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>味一番つばさ 長期実績 2023/8〜2026/8</h1><div class="nav"><a href="./">← ダッシュボード</a></div></header><main><div class="notice"><b>原票37ページを月別に構造化</b>。売上表36か月分を登録。2026年4月は原票の該当ページが給与表のため売上月次は欠損扱い。仕入・粗利益は原票記載値に大きな振れがあるため、売上・客数とは別に「原票参考値」として扱う。</div><div id="cards" class="cards"></div><div class="grid"><div class="panel"><h2>月別実績</h2><div class="scroll"><table><thead><tr><th>月</th><th>売上</th><th>客数</th><th>客単価</th><th>仕入(原票)</th><th>売上-仕入</th><th>原票頁</th></tr></thead><tbody id="rows"></tbody></table></div></div><div><div class="panel"><h2>売上ランキング</h2><div id="rank"></div></div><div class="panel" style="margin-top:12px"><h2>経営上の読み方</h2><div id="insights"></div></div></div></div></main><script>const data=[
['2023-08',7151300,5641446,6815,1],['2023-09',7365390,6635661,6856,2],['2023-10',6504053,5576291,6062,3],['2023-11',5281960,5201420,4875,4],['2023-12',6559240,6220019,6145,5],['2024-01',7563920,6750629,6894,6],['2024-02',6622630,8946717,6252,7],['2024-03',4426650,6412199,4175,8],['2024-04',5699340,5156347,5257,9],['2024-05',7088040,6204353,6537,10],['2024-06',7569620,6307020,6348,11],['2024-07',8397080,5820191,7082,12],['2024-08',7775130,8385485,6522,13],['2024-09',6658810,6101821,5701,14],['2024-10',5965840,4977559,5124,15],['2024-11',7069710,6129906,6053,16],['2024-12',5860120,6869564,4917,17],['2025-01',7072722,5371186,5743,18],['2025-02',5733020,8548792,4859,19],['2025-03',3861770,5251049,3286,20],['2025-04',5757370,4656224,4920,21],['2025-05',6258160,6765442,5294,22],['2025-06',5888470,6202685,4991,23],['2025-07',6583086,5871054,5708,24],['2025-08',6272550,8439830,5402,25],['2025-09',5832540,5910531,5118,26],['2025-10',4865320,4682368,4236,27],['2025-11',6046760,5978050,5052,28],['2025-12',4659260,5585206,3867,29],['2026-01',6229990,5736288,5130,30],['2026-02',5256460,7799927,4379,31],['2026-03',3590555,5752649,2839,32],['2026-05',4749577,4360433,3640,34],['2026-06',5028262,5722166,3816,35],['2026-07',5560344,4706180,3908,36],['2026-08',5254100,4454399,4002,37]
].map(r=>({month:r[0],sales:r[1],purchases:r[2],customers:r[3],page:r[4],avg:r[1]/r[3],margin:r[1]-r[2]}));const yen=n=>'¥'+Math.round(n).toLocaleString();const total=data.reduce((s,r)=>s+r.sales,0),cust=data.reduce((s,r)=>s+r.customers,0),avg=total/data.length,avgSpend=total/cust;const best=[...data].sort((a,b)=>b.sales-a.sales)[0],worst=[...data].sort((a,b)=>a.sales-b.sales)[0];document.getElementById('cards').innerHTML=[['構造化済み','36か月','37頁中・売上表36頁'],['累計売上',yen(total),'登録済み月の合計'],['月平均売上',yen(avg),'36か月平均'],['累計客数',cust.toLocaleString()+'人','原票人数累計'],['平均客単価',yen(avgSpend),'累計売上÷累計客数'],['最高月',best.month, yen(best.sales)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('');document.getElementById('rows').innerHTML=data.map(r=>`<tr><td>${r.month}</td><td>${yen(r.sales)}</td><td>${r.customers.toLocaleString()}</td><td>${yen(r.avg)}</td><td>${yen(r.purchases)}</td><td class="${r.margin<0?'neg':'pos'}">${yen(r.margin)}</td><td>${r.page}</td></tr>`).join('');const top=[...data].sort((a,b)=>b.sales-a.sales).slice(0,10);document.getElementById('rank').innerHTML=top.map((r,i)=>`<div><b>${i+1}. ${r.month}</b> ${yen(r.sales)}<div class="bar"><div class="fill" style="width:${r.sales/best.sales*100}%"></div></div></div>`).join('');const y2024=data.filter(r=>r.month.startsWith('2024-')),y2025=data.filter(r=>r.month.startsWith('2025-'));const s=a=>a.reduce((x,r)=>x+r.sales,0);document.getElementById('insights').innerHTML=`<div class="insight"><b>ピーク</b><br>${best.month} ${yen(best.sales)}。この原票群では最高。</div><div class="insight"><b>底</b><br>${worst.month} ${yen(worst.sales)}。ピークとの差は${yen(best.sales-worst.sales)}。</div><div class="insight"><b>年間比較</b><br>2024年(12か月) ${yen(s(y2024))} / 2025年(12か月) ${yen(s(y2025))}。前年差 ${yen(s(y2025)-s(y2024))}。</div><div class="insight"><b>注意</b><br>仕入欄は売上を上回る月が複数あり、会計上の当月原価とは断定しない。原票値を保持し、コンサル分析では売上・客数・客単価を優先する。</div>`;</script></body></html>
