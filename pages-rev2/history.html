<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>味一番つばさ 長期実績</title><style>:root{--n:#17365d;--b:#4472c4;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:#1f2937}header{background:var(--n);color:#fff;padding:14px 18px}h1{margin:0 0 9px;font-size:21px}header a{display:inline-block;background:var(--b);color:#fff;text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:700}main{max-width:1480px;margin:auto;padding:16px}.notice,.toolbar,.panel,.card{background:#fff;border-radius:10px;padding:13px;box-shadow:0 1px 6px #ccd}.notice{background:#e2f0d9;margin-bottom:11px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}select,button{padding:9px 11px;border:1px solid #b8c2cf;border-radius:7px;font-size:14px}button{font-weight:700;cursor:pointer;background:#d9e2f3;color:var(--n)}button.active{background:var(--n);color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}.big{font-size:23px;font-weight:800;color:var(--n);margin-top:4px}.sub{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}.scroll{overflow:auto;max-height:620px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border:1px solid #d9e2f3;text-align:right;white-space:nowrap}th{background:var(--b);color:#fff;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.bar{height:15px;background:#dbeafe;border-radius:5px;overflow:hidden;margin:5px 0}.fill{height:100%;background:var(--b)}.insight{border-left:5px solid var(--b);background:#f8fafc;padding:9px;margin:7px 0}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>味一番つばさ 長期実績・日別分析</h1><a href="./">← つばさ3 ダッシュボード</a></header><main><div class="notice"><b>原票37ページから日別売上を構造化済み：</b> 36か月・1,096日。各月の日別合計と原票月計が一致したデータを表示。原票に存在しない2024年1月は作らず欠損のまま保持。</div><div class="toolbar"><b>表示</b><select id="year"></select><select id="month"></select><button id="m" onclick="mode='month';render()">単月</button><button id="y" onclick="mode='year';render()">年累計</button><button id="r" onclick="mode='range';render()">選択月まで累計</button><button id="a" onclick="mode='all';render()">全期間累計</button><span id="label"></span></div><div id="cards" class="cards"></div><div class="grid"><div class="panel"><h2>月別実績</h2><div class="scroll"><table><thead><tr><th>月</th><th>月売上</th><th>累計売上</th><th>日数</th><th>平均日商</th></tr></thead><tbody id="monthly"></tbody></table></div></div><div class="panel"><h2>日別実績</h2><div class="scroll"><table><thead><tr><th>日付</th><th>曜日</th><th>売上</th><th>期間累計</th></tr></thead><tbody id="daily"></tbody></table></div></div></div><div class="grid"><div class="panel"><h2>日商ランキング</h2><div id="rank"></div></div><div class="panel"><h2>期間分析</h2><div id="insight"></div></div></div></main><script src="./site-config.js?v=20260912-history"></script><script>let all=[],mode='all';const $=x=>document.getElementById(x),yen=n=>'¥'+Math.round(Number(n||0)).toLocaleString(),dow=['日','月','火','水','木','金','土'];async function load(){const c=window.TSUBASA_CONFIG,u=c.supabaseUrl+'/rest/v1/historical_daily_performance?select=business_date,sales,source_month,source_page,verification_status&order=business_date.asc';const res=await fetch(u,{headers:{apikey:c.publishableKey,'Accept-Profile':'rev2'}});if(!res.ok)throw new Error(await res.text());all=await res.json();const years=[...new Set(all.map(x=>x.source_month.slice(0,4)))];$('year').innerHTML=years.map(v=>`<option>${v}</option>`).join('');$('year').value=years.at(-1);$('year').onchange=months;$('month').onchange=render;months();mode='all';render()}function months(){const y=$('year').value,ms=[...new Set(all.filter(x=>x.source_month.startsWith(y+'-')).map(x=>x.source_month))];$('month').innerHTML=ms.map(v=>`<option value="${v}">${Number(v.slice(5))}月</option>`).join('');$('month').value=ms.at(-1);render()}function chosen(){const ym=$('month').value,y=$('year').value;if(mode==='month')return all.filter(x=>x.source_month===ym);if(mode==='year')return all.filter(x=>x.source_month.startsWith(y+'-')&&x.source_month<=ym);if(mode==='range')return all.filter(x=>x.source_month<=ym);return all}function render(){['m','y','r','a'].forEach(id=>$(id).classList.remove('active'));$({month:'m',year:'y',range:'r',all:'a'}[mode]).classList.add('active');const rows=chosen(),ym=$('month').value,total=rows.reduce((s,x)=>s+Number(x.sales),0),days=rows.length,avg=days?total/days:0,best=[...rows].sort((a,b)=>b.sales-a.sales)[0],worst=[...rows].sort((a,b)=>a.sales-b.sales)[0];const label=mode==='month'?ym:mode==='year'?$('year').value+'年累計':mode==='range'?'2023-08〜'+ym:'全期間 2023-08〜2026-08';$('label').textContent=label;const monthsMap={};rows.forEach(x=>{const z=monthsMap[x.source_month]||(monthsMap[x.source_month]={sales:0,days:0});z.sales+=Number(x.sales);z.days++});const ms=Object.entries(monthsMap).map(([month,v])=>({month,...v}));$('cards').innerHTML=[['期間累計売上',yen(total),label],['登録日数',days.toLocaleString()+'日','検算済み日別データ'],['平均日商',yen(avg),'期間累計÷登録日数'],['対象月数',ms.length+'か月','原票がある月'],['最高日商',best?yen(best.sales):'-',best?.business_date||''],['最低日商',worst?yen(worst.sales):'-',worst?.business_date||'']].map(x=>`<div class="card"><div class="sub">${x[0]}</div><div class="big">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('');let cm=0;$('monthly').innerHTML=ms.map(x=>{cm+=x.sales;return `<tr><td>${x.month}</td><td>${yen(x.sales)}</td><td>${yen(cm)}</td><td>${x.days}</td><td>${yen(x.sales/x.days)}</td></tr>`}).join('');let cd=0;$('daily').innerHTML=rows.map(x=>{cd+=Number(x.sales);const d=new Date(x.business_date+'T00:00:00');return `<tr><td>${x.business_date}</td><td>${dow[d.getDay()]}</td><td>${yen(x.sales)}</td><td>${yen(cd)}</td></tr>`}).join('');const top=[...rows].sort((a,b)=>b.sales-a.sales).slice(0,15),mx=top[0]?.sales||1;$('rank').innerHTML=top.map((x,i)=>`<div><b>${i+1}. ${x.business_date}</b> ${yen(x.sales)}<div class="bar"><div class="fill" style="width:${x.sales/mx*100}%"></div></div></div>`).join('');const weekday={};rows.forEach(x=>{const d=dow[new Date(x.business_date+'T00:00:00').getDay()],z=weekday[d]||(weekday[d]={s:0,n:0});z.s+=Number(x.sales);z.n++});const wd=Object.entries(weekday).sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n);$('insight').innerHTML=`<div class="insight"><b>期間</b><br>${label}</div><div class="insight"><b>最高日</b><br>${best?.business_date||'-'} ${best?yen(best.sales):'-'}</div><div class="insight"><b>最低日</b><br>${worst?.business_date||'-'} ${worst?yen(worst.sales):'-'}</div><div class="insight"><b>曜日別平均日商 1位</b><br>${wd[0]?wd[0][0]+'曜日 '+yen(wd[0][1].s/wd[0][1].n):'-'}</div><div class="insight"><b>データ方針</b><br>日別売上は月計一致を確認済み。客数は誤読を避けるため、日別の検算が終わるまでここでは混ぜない。</div>`}load().catch(e=>{$('label').textContent='読込エラー';console.error(e)});</script></body></html>
