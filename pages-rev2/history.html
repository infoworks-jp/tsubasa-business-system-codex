<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>味一番つばさ 長期実績</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f4f7fb;color:#1f2937}*{box-sizing:border-box}header{background:#17365d;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}header h1{margin:0 0 10px;font-size:21px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{background:#4472c4;color:#fff;text-decoration:none;padding:10px 13px;border-radius:7px;font-weight:700}main{max-width:1450px;margin:auto;padding:16px}.notice{padding:12px;border-radius:9px;background:#fff2cc;margin-bottom:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:12px;border-radius:11px;box-shadow:0 1px 6px #ccd;margin-bottom:12px}.toolbar select,.toolbar button{padding:9px 12px;border:1px solid #b8c2cf;border-radius:7px;font-size:15px}.toolbar button{background:#d9e2f3;color:#17365d;font-weight:700;cursor:pointer}.toolbar button.active{background:#17365d;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card,.panel{background:#fff;border-radius:11px;padding:14px;box-shadow:0 1px 6px #ccd}.label{font-size:13px;color:#64748b}.big{font-size:24px;font-weight:800;color:#17365d;margin-top:4px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border:1px solid #d9e2f3;text-align:right;white-space:nowrap}th{background:#4472c4;color:#fff;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.scroll{max-height:720px;overflow:auto}.neg{color:#b91c1c;font-weight:700}.pos{color:#15803d;font-weight:700}.bar{height:18px;background:#dbeafe;border-radius:5px;overflow:hidden;margin:6px 0}.fill{height:100%;background:#4472c4}.sub{font-size:12px;color:#64748b}.insight{border-left:5px solid #4472c4;padding:9px 12px;background:#f8fafc;margin:8px 0}.range{font-weight:800;color:#17365d}.muted{color:#64748b}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eef8;font-size:12px;margin-left:6px}@media(max-width:900px){.grid{grid-template-columns:1fr}header{position:static}}</style></head><body><header><h1>味一番つばさ 長期実績 2023/8〜2026/8</h1><div class="nav"><a href="./">← つばさ3 ダッシュボード</a></div></header><main><div class="notice"><b>原票37ページを長期分析用に構造化。</b> 売上表36か月分を登録。2026年4月は原票ページが給与表のため月次売上は欠損扱い。仕入欄は原票値をそのまま保持し、会計上の当月原価とは断定しません。</div><div class="toolbar"><b>表示期間</b><select id="yearSel"></select><select id="monthSel"></select><button id="modeMonth" onclick="setMode('month')">単月</button><button id="modeYtd" onclick="setMode('ytd')">年累計</button><button id="modeRange" onclick="setMode('range')">選択月まで累計</button><button id="modeAll" onclick="setMode('all')">全期間累計</button><span id="rangeLabel" class="range"></span></div><div id="cards" class="cards"></div><div class="grid"><div class="panel"><h2>月別実績 <span id="countPill" class="pill"></span></h2><div class="scroll"><table><thead><tr><th>月</th><th>売上</th><th>累計売上</th><th>客数</th><th>累計客数</th><th>客単価</th><th>仕入(原票)</th><th>売上-仕入</th><th>原票頁</th></tr></thead><tbody id="rows"></tbody></table></div></div><div><div class="panel"><h2>売上ランキング</h2><div id="rank"></div></div><div class="panel" style="margin-top:12px"><h2>期間分析</h2><div id="insights"></div></div></div></div></main><script>const data=[['2023-08',7151300,5641446,6815,1],['2023-09',7365390,6635661,6856,2],['2023-10',6504053,5576291,6062,3],['2023-11',5281960,5201420,4875,4],['2023-12',6559240,6220019,6145,5],['2024-01',7563920,6750629,6894,6],['2024-02',6622630,8946717,6252,7],['2024-03',4426650,6412199,4175,8],['2024-04',5699340,5156347,5257,9],['2024-05',7088040,6204353,6537,10],['2024-06',7569620,6307020,6348,11],['2024-07',8397080,5820191,7082,12],['2024-08',7775130,8385485,6522,13],['2024-09',6658810,6101821,5701,14],['2024-10',5965840,4977559,5124,15],['2024-11',7069710,6129906,6053,16],['2024-12',5860120,6869564,4917,17],['2025-01',7072722,5371186,5743,18],['2025-02',5733020,8548792,4859,19],['2025-03',3861770,5251049,3286,20],['2025-04',5757370,4656224,4920,21],['2025-05',6258160,6765442,5294,22],['2025-06',5888470,6202685,4991,23],['2025-07',6583086,5871054,5708,24],['2025-08',6272550,8439830,5402,25],['2025-09',5832540,5910531,5118,26],['2025-10',4865320,4682368,4236,27],['2025-11',6046760,5978050,5052,28],['2025-12',4659260,5585206,3867,29],['2026-01',6229990,5736288,5130,30],['2026-02',5256460,7799927,4379,31],['2026-03',3590555,5752649,2839,32],['2026-05',4749577,4360433,3640,34],['2026-06',5028262,5722166,3816,35],['2026-07',5560344,4706180,3908,36],['2026-08',5254100,4454399,4002,37]].map(r=>({month:r[0],sales:r[1],purchases:r[2],customers:r[3],page:r[4],avg:r[1]/r[3],margin:r[1]-r[2]}));const yen=n=>'¥'+Math.round(Number(n||0)).toLocaleString();let mode='all';const y=$=>document.getElementById($);const years=[...new Set(data.map(r=>r.month.slice(0,4)))];function init(){y('yearSel').innerHTML=years.map(v=>`<option value="${v}">${v}年</option>`).join('');y('yearSel').value='2026';rebuildMonths();y('monthSel').value='2026-08';y('yearSel').onchange=()=>{rebuildMonths();render()};y('monthSel').onchange=render;setMode('all')}function rebuildMonths(){const yr=y('yearSel').value;y('monthSel').innerHTML=data.filter(r=>r.month.startsWith(yr+'-')).map(r=>`<option value="${r.month}">${Number(r.month.slice(5))}月</option>`).join('');if(y('monthSel').options.length)y('monthSel').selectedIndex=y('monthSel').options.length-1}function setMode(m){mode=m;['Month','Ytd','Range','All'].forEach(n=>y('mode'+n).classList.toggle('active',m===n.toLowerCase()));render()}function selected(){const target=y('monthSel').value||data[data.length-1].month,yr=y('yearSel').value;if(mode==='month')return data.filter(r=>r.month===target);if(mode==='ytd')return data.filter(r=>r.month.startsWith(yr+'-')&&r.month<=target);if(mode==='range')return data.filter(r=>r.month<=target);return data}function render(){const rows=selected(),target=y('monthSel').value||'',total=rows.reduce((s,r)=>s+r.sales,0),cust=rows.reduce((s,r)=>s+r.customers,0),purchases=rows.reduce((s,r)=>s+r.purchases,0),avg=rows.length?total/rows.length:0,avgSpend=cust?total/cust:0,best=[...rows].sort((a,b)=>b.sales-a.sales)[0],worst=[...rows].sort((a,b)=>a.sales-b.sales)[0];const label=mode==='month'?target:mode==='ytd'?`${y('yearSel').value}年1月〜${Number(target.slice(5))}月`:mode==='range'?`2023年8月〜${target.replace('-','年')}月`:'2023年8月〜2026年8月';y('rangeLabel').textContent=label;y('countPill').textContent=rows.length+'か月';const cards=[['期間累計売上',yen(total),label],['期間累計客数',cust.toLocaleString()+'人','原票人数累計'],['期間平均月商',yen(avg),rows.length+'か月平均'],['期間平均客単価',yen(avgSpend),'累計売上÷累計客数'],['原票仕入累計',yen(purchases),'参考値'],['最高月',best?best.month:'-',best?yen(best.sales):'-']];y('cards').innerHTML=cards.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('');let cs=0,cc=0;y('rows').innerHTML=rows.map(r=>{cs+=r.sales;cc+=r.customers;return `<tr><td>${r.month}</td><td>${yen(r.sales)}</td><td>${yen(cs)}</td><td>${r.customers.toLocaleString()}</td><td>${cc.toLocaleString()}</td><td>${yen(r.avg)}</td><td>${yen(r.purchases)}</td><td class="${r.margin<0?'neg':'pos'}">${yen(r.margin)}</td><td>${r.page}</td></tr>`}).join('');const top=[...rows].sort((a,b)=>b.sales-a.sales).slice(0,10),mx=top[0]?.sales||1;y('rank').innerHTML=top.map((r,i)=>`<div><b>${i+1}. ${r.month}</b> ${yen(r.sales)}<div class="bar"><div class="fill" style="width:${r.sales/mx*100}%"></div></div></div>`).join('');let yoy='比較対象不足';if(mode==='month'){const [yy,mm]=target.split('-'),prev=data.find(r=>r.month===`${Number(yy)-1}-${mm}`),cur=rows[0];if(prev&&cur)yoy=`前年同月比 ${((cur.sales/prev.sales-1)*100).toFixed(1)}%（${yen(cur.sales-prev.sales)}）`;}y('insights').innerHTML=`<div class="insight"><b>対象</b><br>${label}</div><div class="insight"><b>売上</b><br>累計 ${yen(total)} / 月平均 ${yen(avg)}</div><div class="insight"><b>客数・客単価</b><br>${cust.toLocaleString()}人 / ${yen(avgSpend)}</div><div class="insight"><b>最高・最低</b><br>${best?best.month+' '+yen(best.sales):'-'} / ${worst?worst.month+' '+yen(worst.sales):'-'}</div><div class="insight"><b>前年同月</b><br>${yoy}</div><div class="insight"><b>注意</b><br>仕入は原票の記載値を保持。売上を上回る月もあるため、会計原価としてではなく参考系列として扱う。</div>`}init();</script></body></html>
