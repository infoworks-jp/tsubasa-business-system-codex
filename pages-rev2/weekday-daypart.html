<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>味一番つばさ 曜日×時間帯分析</title><style>:root{--nav:#17365d;--blue:#4472c4;--bg:#f4f7fb;--text:#1f2937;--muted:#64748b;--ok:#e2f0d9;--warn:#fff2cc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--nav);color:#fff;padding:14px 18px}header h1{margin:0;font-size:21px}main{max-width:1400px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:9px 12px;border-radius:7px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}.card,.panel{background:#fff;border-radius:11px;padding:14px;box-shadow:0 1px 6px #ccd}.label{font-size:14px}.big{font-size:23px;font-weight:800;color:var(--nav);margin-top:5px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.notice{padding:10px;border-radius:7px;background:var(--warn);margin:12px 0}.ok{background:var(--ok)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border:1px solid #d9e2f3;text-align:right;white-space:nowrap}th{background:var(--blue);color:#fff}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.insight{border-left:5px solid var(--blue);padding:10px 12px;background:#f8fafc;margin:8px 0}.rank1{font-weight:800;background:#fff8dc}.rank2{font-weight:800;background:#f3f6fb}@media(max-width:700px){main{padding:10px}.big{font-size:20px}}</style></head><body><header><h1>味一番つばさ　曜日×時間帯分析</h1></header><main><div class="toolbar"><a class="btn" href="./">← つばさ3 ダッシュボード</a></div><div class="notice ok"><b>Supabase正規データから自動集計</b>　曜日別の平均売上・客数・昼・夜・深夜と、売上ランキングを自動更新します。</div><div id="cards" class="cards"></div><div class="panel"><h3>曜日別 平均売上・時間帯</h3><div class="scroll"><table><thead><tr><th>曜日</th><th>営業日数</th><th>平均売上</th><th>平均客数</th><th>平均昼</th><th>平均夜</th><th>平均深夜</th><th>最高売上</th></tr></thead><tbody id="weekdayBody"></tbody></table></div></div><div class="panel" style="margin-top:12px"><h3>売上ランキング</h3><div class="scroll"><table><thead><tr><th>順位</th><th>営業日</th><th>曜日</th><th>売上</th><th>客数</th><th>昼</th><th>夜</th><th>深夜</th></tr></thead><tbody id="rankBody"></tbody></table></div></div><div class="panel" style="margin-top:12px"><h3>経営判断メモ</h3><div id="insights"></div></div><script src="./site-config.js?v=20260902-central"></script><script>const {supabaseUrl:U,publishableKey:K,schema:S}=window.TSUBASA_CONFIG;const yen=n=>'¥'+Math.round(Number(n||0)).toLocaleString('ja-JP');const wd=['日','月','火','水','木','金','土'];const avg=(a,k)=>a.length?a.reduce((s,x)=>s+Number(x[k]||0),0)/a.length:0;async function load(){const r=await fetch(`${U}/rest/v1/daily_journal?select=business_date,sales_total,customer_count,lunch_sales,evening_sales,late_sales,status&status=eq.confirmed&sales_total=gt.0&order=business_date.asc`,{headers:{apikey:K,Authorization:`Bearer ${K}`,'Accept-Profile':S}});if(!r.ok)throw new Error('日別データ取得失敗 '+r.status);const rows=await r.json();const enriched=rows.map(x=>({...x,day:new Date(x.business_date+'T12:00:00+09:00').getDay()}));const byDay=[0,1,2,3,4,5,6].map(d=>{const a=enriched.filter(x=>x.day===d);return{d,days:a.length,avgSales:avg(a,'sales_total'),avgCust:avg(a,'customer_count'),avgLunch:avg(a,'lunch_sales'),avgEvening:avg(a,'evening_sales'),avgLate:avg(a,'late_sales'),maxSales:Math.max(0,...a.map(x=>Number(x.sales_total||0)))}});document.getElementById('weekdayBody').innerHTML=byDay.map(x=>`<tr><td>${wd[x.d]}曜</td><td>${x.days}</td><td>${yen(x.avgSales)}</td><td>${x.avgCust.toFixed(1)}人</td><td>${yen(x.avgLunch)}</td><td>${yen(x.avgEvening)}</td><td>${yen(x.avgLate)}</td><td>${yen(x.maxSales)}</td></tr>`).join('');const ranked=[...enriched].sort((a,b)=>Number(b.sales_total)-Number(a.sales_total));document.getElementById('rankBody').innerHTML=ranked.slice(0,20).map((x,i)=>`<tr class="${i===0?'rank1':i===1?'rank2':''}"><td>${i+1}</td><td>${x.business_date}</td><td>${wd[x.day]}曜</td><td>${yen(x.sales_total)}</td><td>${Number(x.customer_count||0).toLocaleString()}人</td><td>${yen(x.lunch_sales)}</td><td>${yen(x.evening_sales)}</td><td>${yen(x.late_sales)}</td></tr>`).join('');const bestSales=[...byDay].sort((a,b)=>b.avgSales-a.avgSales)[0],bestLunch=[...byDay].sort((a,b)=>b.avgLunch-a.avgLunch)[0],bestEvening=[...byDay].sort((a,b)=>b.avgEvening-a.avgEvening)[0],bestLate=[...byDay].sort((a,b)=>b.avgLate-a.avgLate)[0],top1=ranked[0],top2=ranked[1];document.getElementById('cards').innerHTML=`<div class="card"><div class="label">平均売上 最強曜日</div><div class="big">${wd[bestSales.d]}曜</div><div class="sub">${yen(bestSales.avgSales)}</div></div><div class="card"><div class="label">昼 最強曜日</div><div class="big">${wd[bestLunch.d]}曜</div><div class="sub">${yen(bestLunch.avgLunch)}</div></div><div class="card"><div class="label">夜 最強曜日</div><div class="big">${wd[bestEvening.d]}曜</div><div class="sub">${yen(bestEvening.avgEvening)}</div></div><div class="card"><div class="label">深夜 最強曜日</div><div class="big">${wd[bestLate.d]}曜</div><div class="sub">${yen(bestLate.avgLate)}</div></div>`;const sunday=byDay[0],saturday=byDay[6];let text=`<div class="insight"><b>曜日特性：</b>平均売上は${wd[bestSales.d]}曜が最大。一方、昼は${wd[bestLunch.d]}曜が最大です。</div>`;if(sunday&&saturday)text+=`<div class="insight"><b>日曜の特徴：</b>日曜平均昼売上は${yen(sunday.avgLunch)}。土曜平均${yen(saturday.avgLunch)}と比べても昼が強く、日曜は昼から売上を作りやすい傾向です。</div>`;if(top1&&top2)text+=`<div class="insight"><b>最高売上：</b>1位 ${top1.business_date}（${wd[top1.day]}曜）${yen(top1.sales_total)}、2位 ${top2.business_date}（${wd[top2.day]}曜）${yen(top2.sales_total)}。同じ曜日が上位に重なる場合は、仕込み量・人員配置の重点曜日として扱います。</div>`;text+=`<div class="insight"><b>運用ルール：</b>日曜昼型・土曜夜型・金曜深夜型などを、実データの平均値から自動判定し、仕込み・シフト・発注の経営判断に反映します。</div>`;document.getElementById('insights').innerHTML=text}load().catch(e=>{document.getElementById('insights').innerHTML='<div class="notice">'+e.message+'</div>'})</script></main></body></html>
