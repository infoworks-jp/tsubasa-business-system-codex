<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>つばさシフト</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#15395b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="つばさシフト"><link rel="apple-touch-icon" href="./icon.svg"><style>:root{--n:#15395b;--b:#f4f7fb;--l:#d7e1ec}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--b);color:#1f2937}header{position:sticky;top:0;z-index:5;background:var(--n);color:#fff;padding:12px}h1{font-size:18px;margin:0 0 8px}.bar{display:flex;gap:7px;flex-wrap:wrap}.bar button,.bar select,.back{border:0;border-radius:8px;padding:9px 11px;font-weight:800}.back{text-decoration:none;background:#fff;color:var(--n)}main{padding:10px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;margin-bottom:10px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{background:#f8fbff;border:1px solid #dbe7f3;border-radius:9px;padding:8px}.k b{display:block;font-size:20px;color:var(--n)}.small{font-size:11px;color:#667085}.wrap{overflow:auto;border:1px solid var(--l);border-radius:10px}table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%}th,td{border-right:1px solid var(--l);border-bottom:1px solid var(--l);padding:5px;text-align:center}th{background:#eaf2fb;color:var(--n);font-size:12px}th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:125px;text-align:left;z-index:2}.name{font-weight:900}.meta{font-size:10px;color:#667085}.cell{width:82px;min-height:39px;border:1px solid #ccd8e5;border-radius:7px;background:#fff;font-weight:800;color:var(--n)}.rest{background:#eee;color:#777}.night{background:#f1efff}.peak{background:#fff0f0}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.box{background:#fff;border-radius:16px;padding:14px;width:min(500px,96vw)}.box h2{margin:0 0 10px;color:var(--n)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{min-height:64px;border:2px solid var(--l);border-radius:11px;font-size:16px;font-weight:900;background:#f8fbff}.choices .day{background:#eef9ef}.choices .nightb{background:#f2efff}.choices .off{background:#fff0f0}.times{display:none;margin-top:12px;padding-top:10px;border-top:1px solid var(--l)}.times select,.times button{padding:10px;border:1px solid var(--l);border-radius:8px}.settings{display:grid;grid-template-columns:1.5fr .8fr .8fr 1fr;gap:5px;margin:5px 0}.settings input,.settings select{min-width:0;padding:7px;border:1px solid var(--l);border-radius:7px}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>味一番つばさ｜シフト</h1><div class="bar"><a class="back" href="../">← つばさ3</a><button id="prev">←前月</button><select id="month"></select><button id="next">次月→</button><button id="save">保存</button></div></header><main><div class="card"><div class="kpis"><div class="k"><span class="small">バイト予定時間</span><b id="hours">0h</b></div><div class="k"><span class="small">バイト概算給与</span><b id="cost">¥0</b></div><div class="k"><span class="small">深夜時間</span><b id="deep">0h</b></div></div></div><div class="card"><div class="small">マスを押して「昼・夜・深夜・休み」を選ぶだけ。22時以降は深夜割増25%で概算。</div></div><div class="card"><b>スタッフ設定</b><div id="staff"></div><button id="add">＋追加</button></div><div class="card"><div class="wrap"><table id="tbl"></table></div></div></main><div id="modal" class="modal"><div class="box"><h2 id="mt">勤務時間</h2><div class="choices"><button class="day" data-v="11-18">☀ 昼<br><small>11〜18</small></button><button data-v="18-23">🌆 夜<br><small>18〜23</small></button><button class="nightb" data-v="20-2">🌙 深夜<br><small>20〜2</small></button><button class="off" data-v="休">休み</button></div><button id="detail" style="width:100%;margin-top:10px;padding:10px">時間を細かく変える</button><div id="times" class="times"><select id="st"></select> 〜 <select id="en"></select><button id="apply">決定</button><button id="clear">空欄</button></div><button id="close" style="width:100%;margin-top:10px;padding:10px">閉じる</button></div></div><script>const KEY='tsubasa_shift_pwa_v1',wd=['日','月','火','水','木','金','土'];const id=()=>Math.random().toString(36).slice(2)+Date.now();let S={month:'2026-09',staff:[{id:id(),name:'植山',type:'社員',rate:0,group:'夜メイン'},{id:id(),name:'中山',type:'社員',rate:0,group:'昼・夜ヘルプ'},{id:id(),name:'東出',type:'社員',rate:0,group:'昼のみ'},{id:id(),name:'バイトA',type:'バイト',rate:1100,group:'終電組'},{id:id(),name:'バイトB',type:'バイト',rate:1100,group:'深夜組'},{id:id(),name:'バイトC',type:'バイト',rate:1100,group:'ピーク補助'}],shifts:{}};try{let x=JSON.parse(localStorage.getItem(KEY));if(x)S=x}catch(e){}let C=null;const p=v=>{v=(v||'').replace(/〜|～/g,'-');if(!v||v==='休')return null;let m=v.match(/^(\d{1,2})(?::(\d{2}))?-(\d{1,2})(?::(\d{2}))?$/);if(!m)return null;let a=+m[1]+(+m[2]||0)/60,b=+m[3]+(+m[4]||0)/60;if(b<=a)b+=24;return{a,b,h:b-a}};const nh=q=>q?Math.max(0,Math.min(q.b,29)-Math.max(q.a,22)):0;const sv=()=>localStorage.setItem(KEY,JSON.stringify(S));function opts(){month.innerHTML='';for(let y=2026;y<=2027;y++)for(let m=1;m<=12;m++){let v=y+'-'+String(m).padStart(2,'0'),o=new Option(y+'年'+m+'月',v);month.add(o)}month.value=S.month}function ds(){let[y,m]=S.month.split('-').map(Number);return new Date(y,m,0).getDate()}function key(d){return S.month+'-'+String(d).padStart(2,'0')}function settings(){staff.innerHTML='';S.staff.forEach((x,i)=>{let r=document.createElement('div');r.className='settings';r.innerHTML='<input value="'+x.name+'"><select><option '+(x.type==='社員'?'selected':'')+'>社員</option><option '+(x.type==='バイト'?'selected':'')+'>バイト</option></select><input type="number" value="'+x.rate+'"><input value="'+x.group+'">';let es=r.querySelectorAll('input,select');es[0].onchange=e=>{x.name=e.target.value;sv();render()};es[1].onchange=e=>{x.type=e.target.value;sv();render()};es[2].onchange=e=>{x.rate=+e.target.value;sv();calc()};es[3].onchange=e=>{x.group=e.target.value;sv();render()};staff.append(r)})}function table(){let n=ds(),[y,m]=S.month.split('-').map(Number),h='<thead><tr><th>スタッフ</th>';for(let d=1;d<=n;d++){let w=new Date(y,m-1,d).getDay();h+='<th>'+d+'<br>'+wd[w]+'</th>'}h+='<th>計</th></tr></thead><tbody>';S.staff.forEach(x=>{h+='<tr><td><div class="name">'+x.name+'</div><div class="meta">'+x.type+'｜'+x.group+(x.type==='バイト'?'｜¥'+x.rate:'')+'</div></td>';let t=0;for(let d=1;d<=n;d++){let v=(S.shifts[key(d)]||{})[x.id]||'',q=p(v);if(q)t+=q.h;let cl=v==='休'?'rest':q&&q.b>24?'night':q&&q.a<=20&&q.b>=23?'peak':'';h+='<td><button class="cell '+cl+'" data-d="'+d+'" data-id="'+x.id+'">'+(v||'選ぶ')+'</button></td>'}h+='<td><b>'+t.toFixed(1)+'h</b></td></tr>'});h+='</tbody>';tbl.innerHTML=h;tbl.querySelectorAll('.cell').forEach(b=>b.onclick=()=>openM(+b.dataset.d,b.dataset.id))}function calc(){let H=0,N=0,K=0;for(let d=1;d<=ds();d++)for(let x of S.staff){let v=(S.shifts[key(d)]||{})[x.id]||'',q=p(v);if(x.type==='バイト'&&q){let z=nh(q);H+=q.h;N+=z;K+=(q.h-z)*x.rate+z*x.rate*1.25}}hours.textContent=H.toFixed(1)+'h';deep.textContent=N.toFixed(1)+'h';cost.textContent='¥'+Math.round(K).toLocaleString()}function render(){opts();settings();table();calc()}function openM(d,i){C={d,i};let x=S.staff.find(z=>z.id===i);mt.textContent=d+'日｜'+x.name;modal.classList.add('on')}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setV(b.dataset.v));function setV(v){let k=key(C.d);S.shifts[k]||={};S.shifts[k][C.i]=v;sv();modal.classList.remove('on');render()}detail.onclick=()=>times.style.display=times.style.display==='block'?'none':'block';for(let h=0;h<24;h++)for(let m of [0,30]){let v=m?h+':30':String(h);st.add(new Option(v,v));en.add(new Option(v,v))}st.value='18';en.value='23';apply.onclick=()=>setV(st.value+'-'+en.value);clear.onclick=()=>setV('');close.onclick=()=>modal.classList.remove('on');prev.onclick=()=>{let[y,m]=S.month.split('-').map(Number);m--;if(m<1){m=12;y--}S.month=y+'-'+String(m).padStart(2,'0');sv();render()};next.onclick=()=>{let[y,m]=S.month.split('-').map(Number);m++;if(m>12){m=1;y++}S.month=y+'-'+String(m).padStart(2,'0');sv();render()};month.onchange=e=>{S.month=e.target.value;sv();render()};save.onclick=()=>{sv();save.textContent='保存済み✓';setTimeout(()=>save.textContent='保存',800)};add.onclick=()=>{S.staff.push({id:id(),name:'新規',type:'バイト',rate:1100,group:''});sv();render()};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
