<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>つばさシフト</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#15395b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="つばさシフト"><link rel="apple-touch-icon" href="./icon.svg"><style>:root{--n:#15395b;--bg:#f4f7fb;--line:#d7e1ec}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:#1f2937}header{position:sticky;top:0;z-index:10;background:var(--n);color:#fff;padding:12px}h1{font-size:18px;margin:0 0 8px}.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.bar button,.bar select,.back{border:0;border-radius:8px;padding:10px 11px;font-weight:800;font:inherit}.back{text-decoration:none;background:#fff;color:var(--n)}main{padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{background:#f8fbff;border:1px solid #dbe7f3;border-radius:9px;padding:8px}.k b{display:block;font-size:20px;color:var(--n)}.small{font-size:11px;color:#667085}.settings{display:grid;grid-template-columns:1.5fr .8fr .8fr 1fr;gap:5px;margin:5px 0}.settings input,.settings select{min-width:0;padding:8px;border:1px solid var(--line);border-radius:7px}.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;text-align:center}th{background:#eaf2fb;color:var(--n);font-size:12px}th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:125px;text-align:left;z-index:2}.name{font-weight:900}.meta{font-size:10px;color:#667085}.cell{width:82px;min-height:42px;border:1px solid #ccd8e5;border-radius:7px;background:#fff;font-weight:800;color:var(--n)}.rest{background:#eee;color:#777}.night{background:#f1efff}.peak{background:#fff0f0}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:9999;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.box{background:#fff;border-radius:16px;padding:14px;width:min(500px,96vw);max-height:88vh;overflow:auto}.box h2{margin:0 0 10px;color:var(--n)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{min-height:66px;border:2px solid var(--line);border-radius:11px;font-size:16px;font-weight:900;background:#f8fbff}.choices .day{background:#eef9ef}.choices .nightb{background:#f2efff}.choices .off{background:#fff0f0}#detail,#close{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;font-weight:900;font-size:16px}#detail{background:#eef2f7;color:var(--n)}#close{background:#17365d;color:#fff}.times{display:none;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.times select,.times button{padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>味一番つばさ｜シフト</h1><div class="bar"><a class="back" href="../">← つばさ3</a><button id="prev" type="button">←前月</button><select id="month"></select><button id="next" type="button">次月→</button><button id="saveBtn" type="button">保存</button></div></header><main><div class="card"><div class="kpis"><div class="k"><span class="small">バイト予定時間</span><b id="hours">0h</b></div><div class="k"><span class="small">バイト概算給与</span><b id="cost">¥0</b></div><div class="k"><span class="small">深夜時間</span><b id="deep">0h</b></div></div></div><div class="card"><div class="small">マスを押して「昼・夜・深夜・休み」を選ぶだけ。22時以降は深夜割増25%で概算。</div></div><div class="card"><b>スタッフ設定</b><div id="staff"></div><button id="addBtn" type="button">＋追加</button></div><div class="card"><div class="wrap"><table id="tbl"></table></div></div></main><div id="modal" class="modal" aria-hidden="true"><div class="box" role="dialog" aria-modal="true"><h2 id="modalTitle">勤務時間</h2><div class="choices"><button type="button" class="day" data-v="11-18">☀ 昼<br><small>11〜18</small></button><button type="button" data-v="18-23">🌆 夜<br><small>18〜23</small></button><button type="button" class="nightb" data-v="20-2">🌙 深夜<br><small>20〜2</small></button><button type="button" class="off" data-v="休">休み</button></div><button id="detail" type="button">時間を細かく変える</button><div id="times" class="times"><select id="startTime"></select> 〜 <select id="endTime"></select><button id="applyBtn" type="button">決定</button><button id="clearBtn" type="button">空欄</button></div><button id="close" type="button">閉じる</button></div></div><script>(()=>{'use strict';const KEY='tsubasa_shift_pwa_v2',WD=['日','月','火','水','木','金','土'],uid=()=>Math.random().toString(36).slice(2)+Date.now();let state={month:'2026-09',staff:[{id:uid(),name:'植山',type:'社員',rate:0,group:'夜メイン'},{id:uid(),name:'中山',type:'社員',rate:0,group:'昼・夜ヘルプ'},{id:uid(),name:'東出',type:'社員',rate:0,group:'昼のみ'},{id:uid(),name:'バイトA',type:'バイト',rate:1100,group:'終電組'},{id:uid(),name:'バイトB',type:'バイト',rate:1100,group:'深夜組'},{id:uid(),name:'バイトC',type:'バイト',rate:1100,group:'ピーク補助'}],shifts:{}};try{const old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('tsubasa_shift_pwa_v1')||'null');if(old)state=old}catch(e){}let current=null;const $=id=>document.getElementById(id),monthEl=$('month'),staffEl=$('staff'),tbl=$('tbl'),modal=$('modal'),modalTitle=$('modalTitle'),times=$('times'),startTime=$('startTime'),endTime=$('endTime'),hours=$('hours'),cost=$('cost'),deep=$('deep');function save(){localStorage.setItem(KEY,JSON.stringify(state))}function parseShift(v){v=(v||'').replace(/〜|～/g,'-').trim();if(!v||v==='休')return null;const m=v.match(/^(\d{1,2})(?::(\d{2}))?-(\d{1,2})(?::(\d{2}))?$/);if(!m)return null;let a=+m[1]+(+m[2]||0)/60,b=+m[3]+(+m[4]||0)/60;if(b<=a)b+=24;return{a,b,h:b-a}}function nightHours(q){return q?Math.max(0,Math.min(q.b,29)-Math.max(q.a,22)):0}function parts(){return state.month.split('-').map(Number)}function days(){const[y,m]=parts();return new Date(y,m,0).getDate()}function key(d){return state.month+'-'+String(d).padStart(2,'0')}function renderMonth(){monthEl.innerHTML='';for(let y=2026;y<=2027;y++)for(let m=1;m<=12;m++){const v=y+'-'+String(m).padStart(2,'0');monthEl.add(new Option(y+'年'+m+'月',v))}monthEl.value=state.month}function renderStaff(){staffEl.innerHTML='';state.staff.forEach(x=>{const r=document.createElement('div');r.className='settings';const name=document.createElement('input');name.value=x.name;const type=document.createElement('select');type.add(new Option('社員','社員'));type.add(new Option('バイト','バイト'));type.value=x.type;const rate=document.createElement('input');rate.type='number';rate.value=x.rate||0;const group=document.createElement('input');group.value=x.group||'';name.addEventListener('change',e=>{x.name=e.target.value;save();render()});type.addEventListener('change',e=>{x.type=e.target.value;save();render()});rate.addEventListener('change',e=>{x.rate=Number(e.target.value||0);save();calc()});group.addEventListener('change',e=>{x.group=e.target.value;save();render()});r.append(name,type,rate,group);staffEl.append(r)})}function renderTable(){const n=days(),[y,m]=parts();let h='<thead><tr><th>スタッフ</th>';for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay();h+=`<th>${d}<br>${WD[w]}</th>`}h+='<th>計</th></tr></thead><tbody>';state.staff.forEach(x=>{h+=`<tr><td><div class="name">${x.name}</div><div class="meta">${x.type}｜${x.group||''}${x.type==='バイト'?'｜¥'+x.rate:''}</div></td>`;let total=0;for(let d=1;d<=n;d++){const v=(state.shifts[key(d)]||{})[x.id]||'',q=parseShift(v);if(q)total+=q.h;const cl=v==='休'?'rest':q&&q.b>24?'night':q&&q.a<=20&&q.b>=23?'peak':'';h+=`<td><button type="button" class="cell ${cl}" data-day="${d}" data-staff="${x.id}">${v||'選ぶ'}</button></td>`}h+=`<td><b>${total.toFixed(1)}h</b></td></tr>`});h+='</tbody>';tbl.innerHTML=h;tbl.querySelectorAll('.cell').forEach(btn=>btn.addEventListener('click',()=>openModal(Number(btn.dataset.day),btn.dataset.staff)))}function calc(){let H=0,N=0,K=0;for(let d=1;d<=days();d++)for(const x of state.staff){const v=(state.shifts[key(d)]||{})[x.id]||'',q=parseShift(v);if(x.type==='バイト'&&q){const z=nightHours(q);H+=q.h;N+=z;K+=(q.h-z)*x.rate+z*x.rate*1.25}}hours.textContent=H.toFixed(1)+'h';deep.textContent=N.toFixed(1)+'h';cost.textContent='¥'+Math.round(K).toLocaleString()}function render(){renderMonth();renderStaff();renderTable();calc()}function openModal(day,staffId){current={day,staffId};const x=state.staff.find(z=>z.id===staffId);modalTitle.textContent=day+'日｜'+(x?x.name:'');times.style.display='none';modal.classList.add('on');modal.setAttribute('aria-hidden','false')}function closeModal(){modal.classList.remove('on');modal.setAttribute('aria-hidden','true');current=null}function setValue(v){if(!current)return closeModal();const k=key(current.day);state.shifts[k]||={};state.shifts[k][current.staffId]=v;save();closeModal();render()}document.querySelectorAll('[data-v]').forEach(btn=>btn.addEventListener('click',()=>setValue(btn.dataset.v)));$('detail').addEventListener('click',()=>{times.style.display=times.style.display==='block'?'none':'block'});$('applyBtn').addEventListener('click',()=>setValue(startTime.value+'-'+endTime.value));$('clearBtn').addEventListener('click',()=>setValue(''));$('close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeModal()});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});for(let h=0;h<24;h++)for(const mm of[0,30]){const v=mm?h+':30':String(h);startTime.add(new Option(v,v));endTime.add(new Option(v,v))}startTime.value='18';endTime.value='23';$('prev').addEventListener('click',()=>{let[y,m]=parts();m--;if(m<1){m=12;y--}state.month=y+'-'+String(m).padStart(2,'0');save();render()});$('next').addEventListener('click',()=>{let[y,m]=parts();m++;if(m>12){m=1;y++}state.month=y+'-'+String(m).padStart(2,'0');save();render()});monthEl.addEventListener('change',e=>{state.month=e.target.value;save();render()});$('saveBtn').addEventListener('click',()=>{save();const b=$('saveBtn');b.textContent='保存済み✓';setTimeout(()=>b.textContent='保存',800)});$('addBtn').addEventListener('click',()=>{state.staff.push({id:uid(),name:'新規',type:'バイト',rate:1100,group:''});save();render()});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();</script></body></html>
