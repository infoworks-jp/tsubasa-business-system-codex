<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>味一番つばさ 簡易シフト表</title>
<style>
:root{
  --nav:#15395b; --blue:#2f6fb3; --line:#d7e1ec; --bg:#f4f7fb; --card:#fff;
  --red:#c62828; --green:#2e7d32; --orange:#ef6c00; --muted:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:#1f2937}
header{position:sticky;top:0;z-index:10;background:var(--nav);color:#fff;padding:12px 14px;box-shadow:0 2px 8px #0002}
header h1{font-size:18px;margin:0 0 8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit} #month{min-width:125px;padding:9px 10px;border-radius:8px;border:0;font-weight:800}
button{border:0;border-radius:8px;padding:9px 12px;background:#fff;color:var(--nav);font-weight:700;cursor:pointer}
button.primary{background:#f4b400;color:#111}
button.danger{background:#b3261e;color:#fff}
main{max-width:1500px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:8px}
.kpi{background:#f8fbff;border:1px solid #dbe7f3;border-radius:10px;padding:10px}
.kpi .v{font-size:22px;font-weight:800;color:var(--nav)}
.kpi .s{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.tag{padding:3px 7px;border-radius:999px;border:1px solid var(--line);background:#fff}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
th{position:sticky;top:0;background:#eaf2fb;color:#17365d;z-index:2;font-size:12px}
th:first-child,td:first-child{position:sticky;left:0;z-index:3;background:#fff;min-width:145px;text-align:left}
th:first-child{background:#dbe9f8;z-index:4}
.dayHead .date{font-weight:800;font-size:13px}
.dayHead .dow{font-size:11px;color:var(--muted)}
.dayHead.sun,.dayHead.holiday{background:#fde8e8;color:#9a1c1c}
.dayHead.sat{background:#e8f0ff;color:#174ea6}
.staffName{font-weight:800}
.staffMeta{font-size:11px;color:var(--muted)}
.shiftCell{min-width:92px}
.shiftBtn{width:92px; min-height:40px; border:1px solid #c9d6e4; border-radius:8px;background:#fff; font-weight:800; cursor:pointer; padding:5px 6px; color:#17365d}
.shiftBtn.off{background:#f0f0f0;color:#777}.shiftBtn.night{background:#eef0ff;border-color:#8a92d6}.shiftBtn.peak{background:#fff0f0;border-color:#d97b7b}.shiftBtn.empty{color:#9aa7b5;font-weight:600}
.totalCell{font-weight:800;background:#f8fbff;min-width:80px}
.notice{padding:10px;border-radius:8px;background:#fff7e6;border-left:5px solid #ef9f27;line-height:1.55}
.settings{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}.settings input,.settings select{padding:8px;border:1px solid var(--line);border-radius:7px;width:100%}.small{font-size:12px;color:var(--muted)}
.modal{display:none; position:fixed; inset:0; z-index:9999; background:#0008;align-items:center; justify-content:center; padding:14px}.modal.open{display:flex}.modalCard{width:min(560px,96vw); max-height:90vh; overflow:auto;background:#fff; border-radius:16px; padding:14px; box-shadow:0 12px 40px #0005}.modalTitle{font-size:18px;font-weight:900;color:#17365d;margin-bottom:4px}.modalSub{font-size:13px;color:#6b7280;margin-bottom:10px}.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quickBtn{min-height:54px;border:2px solid #d7e1ec;border-radius:10px;background:#f8fbff;color:#17365d;font-size:15px;font-weight:900;padding:6px;cursor:pointer}.quickBtn.red{background:#fff0f0;border-color:#e3a0a0;color:#9b1c1c}.quickBtn.green{background:#eef9ef;border-color:#9ed0a3;color:#216e27}.quickBtn.purple{background:#f2efff;border-color:#aaa0df;color:#4f46a5}.customBox{margin-top:12px;padding-top:12px;border-top:1px solid #e5e7eb}.timeRow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.timeRow select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-weight:800}.modalActions{display:flex;gap:8px;margin-top:12px}.modalActions button{flex:1;background:#17365d;color:#fff}.modalActions .secondary{background:#e5e7eb;color:#17365d}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1.5fr .8fr .8fr}.shiftBtn{width:84px}}
</style>
</head>
<body>
<header>
  <h1>味一番つばさ｜簡易シフト表</h1>
  <div class="toolbar">
    <a href="../" style="text-decoration:none"><button type="button">← つばさ3ダッシュボード</button></a>
    <button id="prev">← 前月</button>
    <select id="month"></select>
    <button id="next">次月 →</button>
    <button class="primary" id="save">保存</button>
    <button id="export">CSV出力</button>
    <button id="print">印刷</button>
  </div>
</header>
<main>
  <div class="card">
    <div class="grid">
      <div class="kpi"><div class="s">バイト予定時間</div><div class="v" id="ptHours">0h</div></div>
      <div class="kpi"><div class="s">バイト概算給与</div><div class="v" id="ptCost">¥0</div></div>
      <div class="kpi"><div class="s">22時以降の深夜時間</div><div class="v" id="nightHours">0h</div></div>
      <div class="kpi"><div class="s">警告件数</div><div class="v" id="warnings">0</div></div>
    </div>
    <div class="legend" style="margin-top:8px">
      <span class="tag">マスを押すだけで時間選択</span><span class="tag">深夜：20-2</span><span class="tag">休み：休 / ×</span><span class="tag">社員：○ も可</span><span class="tag">22時以降は深夜割増25%で概算</span>
    </div>
  </div>
  <div class="card"><div class="notice">つばさ向け初期設定：植山さん＝夜メイン、中山さん＝昼＋必要時夜ヘルプ、東出さん＝夜不可。<br>バイトは「終電組」「深夜組」を分けて登録できます。入力内容はこの端末のブラウザに保存されます。</div></div>
  <div class="card"><h3 style="margin:0 0 8px">スタッフ設定</h3><div id="staffSettings"></div><button id="addStaff">＋ スタッフ追加</button><span class="small">社員の月給はこの簡易版では給与計算に含めず、バイトの時給のみ集計します。</span></div>
  <div class="card"><div class="tableWrap"><table id="shiftTable"></table></div></div>

<div id="shiftModal" class="modal" aria-hidden="true">
  <div class="modalCard">
    <div class="modalTitle" id="modalTitle">勤務時間を選ぶ</div>
    <div class="modalSub" id="modalSub">基本は4つのボタンから選ぶだけです。</div>
    <div class="quickGrid" id="quickGrid" style="grid-template-columns:repeat(2,1fr)">
      <button class="quickBtn green" data-shift="11-18">☀ 昼<br><small>11〜18</small></button>
      <button class="quickBtn" data-shift="18-23">🌆 夜<br><small>18〜23</small></button>
      <button class="quickBtn purple" data-shift="20-2">🌙 深夜<br><small>20〜2</small></button>
      <button class="quickBtn red" data-shift="休">休み</button>
    </div>
    <button id="advancedToggle" class="secondary" style="width:100%;margin-top:12px;background:#eef2f7;color:#17365d">時間を細かく変える時だけ押す</button>
    <div class="customBox" id="customBox" style="display:none">
      <b>それ以外の時間</b>
      <div class="timeRow" style="margin-top:7px"><select id="startTime"></select><span>〜</span><select id="endTime"></select></div>
      <div class="modalActions"><button id="applyCustom">この時間で決定</button><button id="clearShift" class="secondary">空欄にする</button><button id="closeModal" class="secondary">閉じる</button></div>
    </div>
  </div>
</div>
</main>
<script>
const STORE='tsubasa_shift_app_v1';
const dow=['日','月','火','水','木','金','土'];
const defaultStaff=[
  {id:crypto.randomUUID(),name:'植山',type:'社員',hourly:0,group:'夜メイン'},
  {id:crypto.randomUUID(),name:'中山',type:'社員',hourly:0,group:'昼・夜ヘルプ'},
  {id:crypto.randomUUID(),name:'東出',type:'社員',hourly:0,group:'昼のみ'},
  {id:crypto.randomUUID(),name:'バイトA',type:'バイト',hourly:1100,group:'終電組'},
  {id:crypto.randomUUID(),name:'バイトB',type:'バイト',hourly:1100,group:'深夜組'},
  {id:crypto.randomUUID(),name:'バイトC',type:'バイト',hourly:1100,group:'ピーク補助'}
];
let state={staff:defaultStaff,shifts:{},month:'2026-09'};
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x){state=x}}catch(e){}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('save').textContent='保存済み ✓';setTimeout(()=>document.getElementById('save').textContent='保存',900)}
function ymParts(ym){const [y,m]=ym.split('-').map(Number);return [y,m]}
function daysInMonth(ym){const [y,m]=ymParts(ym);return new Date(y,m,0).getDate()}
function dateKey(day){return `${state.month}-${String(day).padStart(2,'0')}`}
function monthOptions(){const sel=document.getElementById('month');sel.innerHTML='';for(let y=2026;y<=2027;y++)for(let m=1;m<=12;m++){const v=`${y}-${String(m).padStart(2,'0')}`;const o=document.createElement('option');o.value=v;o.textContent=`${y}年${m}月`;sel.append(o)}sel.value=state.month}
function parseShift(v){v=(v||'').trim().replace(/：/g,':').replace(/〜|～|−|―/g,'-');if(!v||v==='休'||v==='×'||v==='x'||v==='X'||v==='○'||v==='〇') return null;const m=v.match(/^(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?$/);if(!m)return null;let s=+m[1]+(+m[2]||0)/60,e=+m[3]+(+m[4]||0)/60;if(e<=s)e+=24;return {s,e,h:e-s}}
function nightHours(parsed){if(!parsed)return 0;let n=0;const a=Math.max(parsed.s,22), b=Math.min(parsed.e,29);if(b>a)n+=b-a;if(parsed.s<5){const b2=Math.min(parsed.e,5); if(b2>parsed.s)n+=b2-parsed.s}return n}
function costFor(staff,v){if(staff.type!=='バイト')return 0;const p=parseShift(v); if(!p)return 0;const nh=nightHours(p);return (p.h-nh)*staff.hourly + nh*staff.hourly*1.25}
function renderSettings(){const host=document.getElementById('staffSettings');host.innerHTML='';state.staff.forEach((s,i)=>{const row=document.createElement('div');row.className='settings';row.innerHTML=`<input value="${s.name}" data-k="name" data-i="${i}" placeholder="名前"><select data-k="type" data-i="${i}"><option ${s.type==='社員'?'selected':''}>社員</option><option ${s.type==='バイト'?'selected':''}>バイト</option></select><input type="number" value="${s.hourly||0}" data-k="hourly" data-i="${i}" placeholder="時給"><input value="${s.group||''}" data-k="group" data-i="${i}" placeholder="区分"><button class="danger" data-del="${i}">削除</button>`;host.append(row)});host.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{const i=+el.dataset.i,k=el.dataset.k;state.staff[i][k]=k==='hourly'?Number(el.value||0):el.value;save();render()});host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.staff.splice(+b.dataset.del,1);save();render()})}
function cellClass(v){const p=parseShift(v);if(!v||v==='○'||v==='〇')return '';if(v==='休'||v==='×'||v==='x'||v==='X')return 'off';if(!p)return 'warn';if(p.e>24||p.s>=22)return 'night';if(p.s<=20&&p.e>=23)return 'peak';return ''}
function renderTable(){const tbl=document.getElementById('shiftTable');tbl.innerHTML='';const n=daysInMonth(state.month), [y,m]=ymParts(state.month);let thead='<thead><tr><th>スタッフ</th>';for(let d=1;d<=n;d++){const dt=new Date(y,m-1,d), wd=dt.getDay();thead+=`<th class="dayHead ${wd===0?'sun':wd===6?'sat':''}"><div class="date">${d}</div><div class="dow">${dow[wd]}</div></th>`}thead+='<th>月計</th></tr></thead>';tbl.insertAdjacentHTML('beforeend',thead);const body=document.createElement('tbody');state.staff.forEach(st=>{const tr=document.createElement('tr');tr.innerHTML=`<td><div class="staffName">${st.name}</div><div class="staffMeta">${st.type}${st.group?'｜'+st.group:''}${st.type==='バイト'?'｜¥'+st.hourly:''}</div></td>`;let total=0;for(let d=1;d<=n;d++){const key=dateKey(d), v=(state.shifts[key]||{})[st.id]||'';const p=parseShift(v); if(p)total+=p.h;const td=document.createElement('td');td.className='shiftCell';const btn=document.createElement('button');btn.className=`shiftBtn ${cellClass(v)} ${v?'':'empty'}`;btn.textContent=v || '選ぶ';btn.onclick=()=>openShiftModal(key,st.id,st.name,d,v);td.append(btn);tr.append(td)}const tc=document.createElement('td');tc.className='totalCell';tc.textContent=total?total.toFixed(1)+'h':'-';tr.append(tc);body.append(tr)});tbl.append(body)}
function updateKPIs(){let pth=0,ptcost=0,nh=0,warn=0;const n=daysInMonth(state.month);for(let d=1;d<=n;d++){const key=dateKey(d);for(const st of state.staff){const v=(state.shifts[key]||{})[st.id]||'';const p=parseShift(v);if(p){if(st.type==='バイト'){pth+=p.h;ptcost+=costFor(st,v);nh+=nightHours(p)}if(p.h>8)warn++;if(st.name.includes('東出') && (p.e>18 || p.s>=18))warn++;} else if(v && !['休','×','x','X','○','〇'].includes(v)) warn++;}}ptHours.textContent=pth.toFixed(1)+'h';ptCost.textContent='¥'+Math.round(ptcost).toLocaleString();nightHours.textContent=nh.toFixed(1)+'h';warnings.textContent=warn}
function render(){monthOptions();renderSettings();renderTable();updateKPIs()}
function changeMonth(delta){let [y,m]=ymParts(state.month);m+=delta;if(m<1){m=12;y--}if(m>12){m=1;y++}state.month=`${y}-${String(m).padStart(2,'0')}`;save();render()}
function exportCSV(){const n=daysInMonth(state.month); let rows=[['スタッフ','区分',...Array.from({length:n},(_,i)=>`${i+1}日`),'月間時間']];for(const st of state.staff){let tot=0, arr=[];for(let d=1;d<=n;d++){const v=(state.shifts[dateKey(d)]||{})[st.id]||'';arr.push(v);const p=parseShift(v);if(p)tot+=p.h}rows.push([st.name,st.type,...arr,tot.toFixed(1)])}const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`つばさシフト_${state.month}.csv`;a.click()}
let modalCtx=null;
function timeOptions(){const vals=[];for(let h=0;h<24;h++){vals.push(String(h));vals.push(`${h}:30`)}return vals}
function fillTimeSelects(){const starts=document.getElementById('startTime'), ends=document.getElementById('endTime');if(starts.options.length)return;const vals=timeOptions();for(const v of vals){const o1=document.createElement('option');o1.value=v;o1.textContent=v;starts.append(o1);const o2=document.createElement('option');o2.value=v;o2.textContent=v;ends.append(o2)}}
function openShiftModal(key,staffId,staffName,day,current){fillTimeSelects();modalCtx={key,staffId};document.getElementById('modalTitle').textContent=`${day}日｜${staffName}`;document.getElementById('modalSub').textContent='「昼・夜・深夜・休み」のどれかを押してください。';const p=parseShift(current);if(p){const fmt=n=>{let x=n%24,h=Math.floor(x),m=Math.round((x-h)*60);return m?`${h}:${String(m).padStart(2,'0')}`:String(h)};startTime.value=fmt(p.s);endTime.value=fmt(p.e)}else{startTime.value='18';endTime.value='23'}shiftModal.classList.add('open');shiftModal.setAttribute('aria-hidden','false')}
function setModalShift(v){if(!modalCtx)return;state.shifts[modalCtx.key] ||= {};state.shifts[modalCtx.key][modalCtx.staffId]=v;save();closeShiftModal();renderTable();updateKPIs()}
function closeShiftModal(){shiftModal.classList.remove('open');shiftModal.setAttribute('aria-hidden','true');modalCtx=null}
function bindModal(){document.querySelectorAll('#quickGrid [data-shift]').forEach(b=>b.onclick=()=>setModalShift(b.dataset.shift));const adv=document.getElementById('advancedToggle');if(adv) adv.onclick=()=>{const b=document.getElementById('customBox');b.style.display=b.style.display==='none'?'block':'none'};const ac=document.getElementById('applyCustom'); if(ac) ac.onclick=()=>setModalShift(`${startTime.value}-${endTime.value}`);const cs=document.getElementById('clearShift'); if(cs) cs.onclick=()=>setModalShift('');const cm=document.getElementById('closeModal'); if(cm) cm.onclick=closeShiftModal;const sm=document.getElementById('shiftModal'); if(sm) sm.onclick=e=>{if(e.target.id==='shiftModal')closeShiftModal()}}
load();bindModal();document.getElementById('prev').onclick=()=>changeMonth(-1);document.getElementById('next').onclick=()=>changeMonth(1);document.getElementById('month').onchange=e=>{state.month=e.target.value;save();render()};document.getElementById('save').onclick=save;document.getElementById('export').onclick=exportCSV;document.getElementById('print').onclick=()=>window.print();document.getElementById('addStaff').onclick=()=>{state.staff.push({id:crypto.randomUUID(),name:'新規',type:'バイト',hourly:1100,group:''});save();render()};render();
</script>
</body>
</html>
