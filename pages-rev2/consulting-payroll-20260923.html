<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>給与・売上の経営コンサル｜味一番つばさ3</title>
<style>
:root{--blue:#28589c;--nav:#17365d;--green:#148778;--bg:#f2f5fa;--ink:#1f2937}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);line-height:1.6}
header{background:var(--nav);color:white;padding:20px max(16px,calc((100vw - 1150px)/2))}header h1{font-size:clamp(22px,3vw,31px);margin:3px 0 14px}
header a{display:inline-block;color:white;background:#4274c2;padding:8px 12px;border-radius:6px;text-decoration:none;margin:0 5px 5px 0}
main{max-width:1150px;margin:0 auto;padding:16px}.panel,.card{background:white;border-radius:13px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px #d9e2ef}
.hero{border-left:6px solid #4472c4}h2{color:var(--nav);font-size:clamp(19px,2.8vw,25px);line-height:1.45;margin:0 0 12px}.muted{font-size:13px;color:#536477}.lead{font-size:clamp(17px,2.5vw,21px);font-weight:750}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card .value{font-size:clamp(23px,3vw,32px);font-weight:800;color:var(--nav);margin:5px 0}.good{color:#166534!important}
.chartwrap{overflow-x:auto}.chart{min-width:670px;display:grid;grid-template-columns:repeat(12,minmax(49px,1fr));gap:8px;align-items:end;height:330px;border-bottom:1px solid #bdcbe0;padding:12px 0 0}
.month{height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;gap:4px;min-width:0}.bars{height:248px;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.bar{width:22px;min-height:1px;border-radius:4px 4px 0 0}.sales{background:var(--green)}.pay{background:var(--blue)}.empty{border:1px dashed #a9b9cf;background:#f1f5f9;height:55px;padding:7px 2px;font-size:10px;color:#64748b;align-self:flex-end}
.month strong{font-size:13px}.month small{font-size:11px;color:#536477}.legend{font-size:13px;margin:12px 0}.legend span{display:inline-block;width:13px;height:13px;border-radius:3px;margin:0 4px 0 12px;vertical-align:middle}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px;font-size:14px}th,td{padding:10px 9px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}th{background:var(--nav);color:white}th:first-child,td:first-child{text-align:left}tbody tr:nth-child(even){background:#f5f8fd}.note{background:#eef4fb;padding:12px;border-radius:7px}.error{background:#fff0e7;border-left:5px solid #bb521f;padding:16px}
@media(max-width:650px){.cards{grid-template-columns:1fr}.panel,.card{padding:16px}.chart{min-width:700px}}@media print{header{background:white;color:black}header a{display:none}.panel,.card{box-shadow:none;border:1px solid #ccc}.chart{min-width:0}}
</style></head>
<body><header><div>味一番つばさ｜経営管理システム</div><h1>給与・売上の経営コンサル</h1><nav><a href="./">つばさ3へ戻る</a><a href="./#fl">FL・改善推移</a><a href="./consulting-history.html">長期コンサル</a></nav></header>
<main id="main"><section class="panel"><h2>最新の給与・売上を確認しています…</h2><p>原票から登録された月次データを取得中です。</p></section></main>
<script src="./site-config.js?v=20261020-payroll-9"></script>
<script>
(function(){
'use strict';
const main=document.getElementById('main'),c=window.TSUBASA_CONFIG;
const yen=n=>Number(n).toLocaleString('ja-JP')+'円',man=n=>(n/10000).toFixed(1)+'万円',pct=n=>(n*100).toFixed(1)+'％';
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
const month=s=>String(s).slice(0,7);
async function get(table,cols,order){
 const url=c.supabaseUrl+'/rest/v1/'+table+'?select='+encodeURIComponent(cols)+'&order='+order;
 const r=await fetch(url,{headers:{apikey:c.publishableKey,'Accept-Profile':c.schema},cache:'no-store'});
 if(!r.ok)throw new Error(table+'の取得エラー HTTP '+r.status);
 const a=await r.json();if(!Array.isArray(a))throw new Error(table+'の形式が不正');return a;
}
async function start(){
 try{
 const [pays,hist,tickets]=await Promise.all([
 get('payroll','payroll_month,employee_gross,parttime_gross,gross_pay,status','payroll_month.asc'),
 get('historical_monthly_performance','month_start,sales_total','month_start.asc'),
 get('monthly_summary','month_start,sales_total,status,is_canonical','month_start.asc')]);
 const rows=pays.filter(p=>month(p.payroll_month).startsWith('2026-')).map(p=>{
 const m=month(p.payroll_month),h=hist.find(x=>month(x.month_start)===m),t=tickets.find(x=>month(x.month_start)===m&&x.status==='confirmed'&&x.is_canonical===true);
 // Jan-May are sourced from the long-term ledger; Jun onward use the canonical ticket series.
 const useTicket=Number(m.slice(5))>=6&&t;
 const source=useTicket?t:h;
 const salary=Number(p.gross_pay),employee=Number(p.employee_gross),parttime=Number(p.parttime_gross);
 if(!Number.isFinite(salary)||salary!==employee+parttime)throw new Error(m+'の給与内訳が不一致');
 return {m,sales:source?Number(source.sales_total):null,salary,employee,parttime,source:useTicket?'券売機確定':'長期原票',status:p.status||''};
 }).sort((a,b)=>a.m.localeCompare(b.m));
 if(!rows.length)throw new Error('2026年給与が見つかりません');
 const latest=rows[rows.length-1],first=rows[0],prev=rows[rows.length-2],delta=first.salary-latest.salary;
 const ratio=r=>r.sales>0?r.salary/r.sales:null;
 const graph=Array.from({length:12},(_,i)=>{
 const r=rows.find(x=>Number(x.m.slice(5))===i+1);
 if(!r||r.sales===null)return '<div class="month"><div class="bars"><div class="empty">未登録</div></div><strong>'+(i+1)+'月</strong><small>—</small></div>';
 const bar=(value,klass,title)=>'<div class="bar '+klass+'" style="height:'+Math.max(2,value/7000000*230)+'px" title="'+esc(title)+'"></div>';
 return '<div class="month"><div class="bars">'+bar(r.sales,'sales','売上 '+yen(r.sales))+bar(r.salary,'pay','給与 '+yen(r.salary))+'</div><strong>'+(i+1)+'月</strong><small>'+pct(ratio(r))+'</small></div>';
 }).join('');
 const data=rows.map(r=>'<tr><td>'+esc(r.m)+'</td><td>'+ (r.sales===null?'未登録':yen(r.sales))+'</td><td>'+yen(r.employee)+'</td><td>'+yen(r.parttime)+'</td><td>'+yen(r.salary)+'</td><td>'+(ratio(r)===null?'—':pct(ratio(r)))+'</td><td>'+esc(r.source)+'</td></tr>').join('');
 const monthLabel=r=>Number(r.m.slice(5))+'月';
 const salesChange=latest.sales!==null&&prev.sales!==null?latest.sales-prev.sales:null;
 main.innerHTML=
 '<section class="panel hero"><div class="muted">2026年の登録済み給与を表示｜最新月 '+esc(latest.m)+'｜更新時点でDBから取得</div>'+
 '<h2>結論：給与率は改善。利益確定には原価と会社負担分の照合が必要</h2>'+
 '<p class="lead">'+monthLabel(latest)+'：売上'+yen(latest.sales)+'・給与'+yen(latest.salary)+'・給与率'+pct(ratio(latest))+'</p>'+
 '<p>1月と比較すると給与は'+yen(delta)+'減少。直近'+monthLabel(prev)+'からは給与'+yen(prev.salary-latest.salary)+'減'+(salesChange===null?'':('、売上'+yen(Math.abs(salesChange))+(salesChange>=0?'増':'減')))+'。ただし、給与差引後の残額は営業利益ではありません。</p></section>'+
 '<div class="cards"><div class="card"><div>最新月の売上</div><div class="value">'+man(latest.sales)+'</div><div class="muted">'+esc(latest.source)+'</div></div>'+
 '<div class="card"><div>最新月の給与総額</div><div class="value">'+man(latest.salary)+'</div><div class="muted">社員'+yen(latest.employee)+'／バイト'+yen(latest.parttime)+'</div></div>'+
 '<div class="card"><div>最新月の給与率</div><div class="value good">'+pct(ratio(latest))+'</div><div class="muted">給与支給総額÷売上。会社負担保険料は別。</div></div></div>'+
 '<section class="panel"><h2>2026年1〜12月｜売上と給与の推移</h2><p class="muted">登録のある月だけ表示。9月は券売機確定売上と9月給与原票を使用。10月以降、給与未登録の月は空欄。</p>'+
 '<div class="legend"><span style="background:#148778"></span>売上 <span style="background:#28589c"></span>給与　（共通目盛り：最大700万円）</div>'+
 '<div class="chartwrap" tabindex="0" aria-label="月別売上・給与のグラフ。横にスクロール可能"><div class="chart">'+graph+'</div></div></section>'+
 '<section class="panel"><h2>月別内訳・出典</h2><div class="scroll"><table><thead><tr><th>年月</th><th>売上</th><th>社員給与</th><th>アルバイト</th><th>給与総額</th><th>給与率</th><th>売上出典</th></tr></thead><tbody>'+data+'</tbody></table></div></section>'+
 '<section class="panel"><h2>経営判断</h2><p class="note">給与率は売上に対する給与支給額の割合です。非課税交通費、会社負担の社会保険料、食材費を含むFL率ではありません。原価・社会保険・営業日数を合わせて比較するまでは「利益が増えた」と断定しません。</p><p class="muted">2026年1〜5月は長期原票、6月以降は券売機確定系列を使用しています。異なる売上系列の比較には注意してください。</p></section>';
 }catch(e){main.innerHTML='<section class="panel error"><h2>データを取得できませんでした</h2><p>'+esc(e.message)+'</p><p>取得失敗を「未登録」「0円」と表示していません。再読み込みして確認してください。</p></section>';}
}
start();
})();
</script></body></html>
