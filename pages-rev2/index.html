<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>味一番つばさ 経営ダッシュボード 公開Web版</title><style>
:root{--nav:#17365d;--blue:#4472c4;--blue2:#5b9bd5;--bg:#f4f7fb;--text:#1f2937;--muted:#64748b;--ok:#e2f0d9;--warn:#fff2cc;--ng:#fce4d6}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--nav);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}header h1{margin:0 0 10px;font-size:21px}nav{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:10px 13px;font-weight:700;cursor:pointer}nav button,.primary{background:var(--blue);color:#fff}
main{max-width:1480px;margin:auto;padding:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select,input,textarea{padding:9px;border:1px solid #b8c2cf;border-radius:6px;font-size:15px}textarea{width:100%;min-height:90px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.card,.panel{background:#fff;border-radius:11px;padding:14px;box-shadow:0 1px 6px #ccd}.card .label{font-size:15px}.big{font-size:23px;font-weight:800;color:var(--nav);margin-top:5px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.up{color:#15803d;font-weight:700}.down{color:#b91c1c;font-weight:700}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#d9e2f3;color:var(--nav)}.tabs button.active{background:var(--nav);color:#fff}.page{display:none}.page.active{display:block}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #d9e2f3;text-align:right;white-space:nowrap}th{background:var(--blue);color:#fff}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto;max-height:680px}.notice{padding:10px;border-radius:7px;background:var(--warn)}.ok{background:var(--ok)}.ng{background:var(--ng)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}
.chart{min-height:280px}.chart svg{width:100%;height:auto;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.metric{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.barbg{height:18px;background:#e8eef8;border-radius:5px;overflow:hidden}.barfill{height:100%;background:var(--blue)}.insight{border-left:5px solid var(--blue);padding:10px 12px;background:#f8fafc;margin:8px 0}.statusHoliday{background:#f3f4f6}.statusPending{background:#fff7ed}.nowrap{white-space:nowrap}
.scopeSwitch{display:inline-flex;background:#e7edf7;border-radius:8px;padding:3px;gap:3px}
.scopeBtn{background:transparent;color:var(--nav);padding:8px 12px}
.scopeBtn.active{background:var(--nav);color:#fff}
.chartMeta{font-size:13px;color:var(--muted);margin:-3px 0 8px}
.chartDetails{max-height:210px;overflow:auto;margin-top:8px;border-top:1px solid #e5e7eb;padding-top:8px}
.chartDetails table{font-size:12px}
.valueLabel{font-size:11px;font-weight:700;fill:#17365d}
.shareText{font-size:12px;color:#475569}

@media(max-width:900px){.grid2,.grid3,.formgrid{grid-template-columns:1fr}header{position:static}.big{font-size:20px}}
</style></head><body><header><h1>味一番つばさ 経営管理システム・公開Web版</h1><nav><button onclick="showPage('dashboard')">ダッシュボード</button></nav></header><main>
<section id="dashboard" class="page active"><div class="toolbar"><b>表示</b><select id="monthSelect" onchange="monthChanged()"></select><span class="scopeSwitch"><button id="scopeMonth" class="scopeBtn active" onclick="setScope('month')">選択月</button><button id="scopeAll" class="scopeBtn" onclick="setScope('all')">累計</button></span><span class="notice ok">Supabase正規データを直接参照</span><span id="updated" class="sub"></span></div><div id="cards" class="cards"></div><div id="integrity" style="margin-top:10px"></div>
<div class="tabs"><button id="t_overview" onclick="showTab('overview')">概要</button><button id="t_monthly" onclick="showTab('monthly')">月別</button><button id="t_management" onclick="showTab('management')">月別経営分析</button><button id="t_payroll" onclick="showTab('payroll')">人件費</button><button id="t_consulting" onclick="showTab('consulting')">経営コンサル</button><button id="t_daily" onclick="showTab('daily')">日別</button><button id="t_weekday" onclick="showTab('weekday')">曜日別</button><button id="t_products" onclick="showTab('products')">商品別・全商品</button><button id="t_abc" onclick="showTab('abc')">ABC分析</button><button id="t_beer" onclick="showTab('beer')">ビール・セット</button><button id="t_hourly" onclick="showTab('hourly')">時間帯</button><button id="t_bank" onclick="showTab('bank')">売上入金照合</button><button id="t_expenses" onclick="showTab('expenses')">仕入・外注・経費</button><button id="t_quality" onclick="showTab('quality')">品質検証</button></div><div id="host"></div></section></main><script src="./site-config.js?v=20260902-central"></script><script src="./rev2-data.js?v=20260902-central"></script><script>

const IS_ADMIN=false;
let state={month:'',scope:'month',tab:'overview',products:[],monthly:[],daily:[],hourly:[],bank:[],overview:null,quality:null};
const $=id=>document.getElementById(id);
function yen(v){return '¥'+Math.round(Number(v||0)).toLocaleString()}
function yenOrStatus(v,status='未確定'){return v==null?status:yen(v)}
function pct(v){return (Number(v||0)*100).toFixed(1)+'%'}
function ymLabel(m){if(!m)return'';const [y,mo]=m.split('-');return `${Number(y)}年${Number(mo)}月`}
function dayLabel(d){return String(d||'').slice(5).replace('-','/')}function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
async function api(url,opt){
 if(opt)throw new Error('公開Web版は閲覧専用です');
 return window.rev2Api(url);
}
async function init(){for(let attempt=0;attempt<3;attempt++){try{const b=await api('/api/bootstrap');state.monthly=await api('/api/monthly');$('monthSelect').innerHTML=b.months.map(m=>`<option value="${m}">${ymLabel(m)}</option>`).join('');state.month=b.active_month;$('monthSelect').value=state.month;await reloadCurrent();return}catch(error){if(attempt===2){$('updated').textContent='データ取得エラー（再読込してください）';console.error(error);return}await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))}}}
function currentScope(){return state.scope==='all'?'all':state.month}
function scopeLabel(){return state.scope==='all'?'累計（全期間）':ymLabel(state.month)}
function monthChanged(){state.month=$('monthSelect').value;if(state.scope!=='month')setScope('month');else reloadCurrent()}
async function setScope(scope){state.scope=scope;$('scopeMonth').classList.toggle('active',scope==='month');$('scopeAll').classList.toggle('active',scope==='all');$('monthSelect').disabled=scope==='all';await reloadCurrent()}
async function reloadCurrent(){const selected=$('monthSelect').value;if(selected)state.month=selected;const s=currentScope();if(s!=='all'&&!/^\d{4}-\d{2}$/.test(s))return;const [ov,d,p,h,b,q]=await Promise.all([api('/api/overview/'+s),api('/api/daily/'+s),api('/api/products/'+s),api('/api/hourly/'+s),api('/api/bank/'+s),api('/api/quality/'+s)]);state.overview=ov;state.quality=q;state.daily=d;state.products=p;state.hourly=h.rows;state.bank=b;renderCards(ov);renderIntegrity(q);await showTab(state.tab);$('updated').textContent='データ更新 '+new Date().toLocaleString('ja-JP')}
function priorMetric(month,key){const i=state.monthly.findIndex(x=>x.month===month);if(i<=0)return null;return state.monthly[i-1][key]}
function diffHtml(current,previous){if(previous===null||previous===undefined||Number(previous)===0)return '<span class="sub">前月比較なし</span>';const d=(Number(current)-Number(previous))/Number(previous);return `<span class="${d>=0?'up':'down'}">前月比 ${d>=0?'+':''}${(d*100).toFixed(1)}%</span>`}
function renderCards(d){let cards;if(state.scope==='all'){cards=[['累計売上',yen(d.total_sales),'全期間'],['累計客数',Number(d.total_customers).toLocaleString()+'人','全期間'],['累計営業日数',d.total_days+'日','売上0円の日を除外'],['累計平均日商',yen(d.avg_daily),'累計売上÷営業日数'],['累計客単価',yen(d.avg_spend),'累計売上÷累計客数'],['対象月数',d.month_count+'か月','登録済みの月'],['月平均売上',yen(d.avg_monthly),'累計売上÷対象月数'],['1日平均客数',Number(d.avg_customers_per_day||0).toFixed(1)+'人','累計客数÷営業日数']]}else{const pSales=priorMetric(d.month,'sales'),pDaily=priorMetric(d.month,'avg_daily'),pSpend=priorMetric(d.month,'avg_spend');cards=[['累計売上',yen(d.total_sales),'全期間'],['累計客数',Number(d.total_customers).toLocaleString()+'人','全期間'],['累計営業日数',d.total_days+'日','売上0円の日を除外'],[ymLabel(d.month)+'売上',yen(d.month_sales),diffHtml(d.month_sales,pSales)],[ymLabel(d.month)+'平均日商',yen(d.avg_daily),diffHtml(d.avg_daily,pDaily)],[ymLabel(d.month)+'客単価',yen(d.avg_spend),diffHtml(d.avg_spend,pSpend)],[ymLabel(d.month)+'営業日数',d.month_days+'日','休業・入力待ちは除外'],['データ状態',state.quality.status,state.quality.matched?'全検算・原本確認済み':'欠損または不一致あり']]}$('cards').innerHTML=cards.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}
function renderIntegrity(q){const product=q.products==null?q.source_scope.product:(q.product_match?yen(q.products)+' 一致':yen(q.products)+' 要確認');const hourly=q.hourly==null?'原本未登録':yen(q.hourly)+'（'+q.source_scope.hourly+'）';$('integrity').innerHTML=`<div class="notice ${q.matched?'ok':'ng'}"><b>${scopeLabel()} 売上検算 ${q.matched?'一致':'要確認'}</b>　日別（精算後）${yen(q.daily)}／商品別 ${product}／時間帯（発行）${hourly}／原本 ${q.source_scope.document}　休業 ${q.holidays}日／入力待ち ${q.pending}日</div>`}
async function showTab(tab){state.tab=tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));$('t_'+tab)?.classList.add('active');$('host').innerHTML='<div class="panel">読み込み中...</div>';
 if(tab==='overview')return renderOverview();if(tab==='monthly')return renderMonthly();if(tab==='management')return renderManagementMonthly();if(tab==='payroll')return renderPayroll();if(tab==='consulting')return renderConsulting();if(tab==='daily')return renderDaily();if(tab==='weekday')return renderWeekday();if(tab==='products')return renderProducts();if(tab==='abc')return renderABC();if(tab==='beer')return renderBeer();if(tab==='hourly')return renderHourly();if(tab==='bank')return renderBank();if(tab==='expenses')return renderExpenses();if(tab==='quality')return renderQuality()}
function compactYen(v){const n=Math.round(Number(v||0));if(Math.abs(n)>=1000000)return (n/1000000).toFixed(1)+'百万円';if(Math.abs(n)>=10000)return (n/10000).toFixed(1)+'万円';return n.toLocaleString()+'円'}
function formatGraphValue(v,format='yen'){if(format==='percent')return Number(v||0).toFixed(1)+'%';if(format==='count')return Math.round(Number(v||0)).toLocaleString();return yen(v)}
function graphMeta(unit,detail=''){return `<div class="chartMeta">単位：${unit}${detail?'　'+detail:''}</div>`}
function lineSvg(rows){const data=rows.map(r=>({label:state.scope==='all'?String(r.business_date).slice(2).replaceAll('-','/'):dayLabel(r.business_date),value:+r.total_sales||0,date:r.business_date}));const W=900,H=340,pL=65,pR=20,pT=34,pB=52,max=Math.max(1,...data.map(x=>x.value));const step=(W-pL-pR)/Math.max(1,data.length-1);const pts=data.map((x,i)=>[pL+i*step,H-pB-(x.value/max)*(H-pT-pB)]);let svg=`<svg viewBox="0 0 ${W} ${H}" aria-label="日別売上推移">`;for(let i=0;i<5;i++){const y=pT+i*(H-pT-pB)/4,val=max*(1-i/4);svg+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#dbe3ef"/><text x="${pL-8}" y="${y+4}" text-anchor="end" font-size="11">${compactYen(val)}</text>`}svg+=`<text x="8" y="18" font-size="12" font-weight="700">売上（円）</text><polyline fill="none" stroke="#17365d" stroke-width="3" points="${pts.map(a=>a.join(',')).join(' ')}"/>`;const labelEvery=Math.max(1,Math.ceil(data.length/14));pts.forEach((a,i)=>{const zero=data[i].value===0;svg+=`<circle cx="${a[0]}" cy="${a[1]}" r="${zero?5:4}" fill="${zero?'#dc2626':'#4472c4'}"><title>${data[i].date} ${yen(data[i].value)}</title></circle>`;if(i%labelEvery===0||i===data.length-1){svg+=`<text class="valueLabel" x="${a[0]}" y="${Math.max(18,a[1]-9)}" text-anchor="middle">${compactYen(data[i].value)}</text><text x="${a[0]}" y="${H-17}" text-anchor="middle" font-size="10" transform="rotate(-35 ${a[0]} ${H-17})">${data[i].label}</text>`}});return svg+'</svg>'}
function barSvg(rows,labelKey='label',valueKey='value',opts={}){const format=opts.format||'yen',showShare=opts.showShare!==false,total=opts.total??rows.reduce((s,x)=>s+(+x[valueKey]||0),0);const W=900,H=340,pL=65,pR=20,pT=42,pB=65,max=Math.max(1,...rows.map(x=>+x[valueKey]||0));const bw=(W-pL-pR)/Math.max(1,rows.length);let svg=`<svg viewBox="0 0 ${W} ${H}">`;for(let i=0;i<5;i++){const y=pT+i*(H-pT-pB)/4,val=max*(1-i/4),axis=format==='percent'?val.toFixed(1)+'%':compactYen(val);svg+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#dbe3ef"/><text x="${pL-8}" y="${y+4}" text-anchor="end" font-size="11">${axis}</text>`}rows.forEach((r,i)=>{const v=+r[valueKey]||0,h=v/max*(H-pT-pB),x=pL+i*bw+5,y=H-pB-h,w=Math.max(5,bw-10),share=total?v/total:0;svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#5b9bd5"><title>${r[labelKey]} ${formatGraphValue(v,format)}${showShare?' '+pct(share):''}</title></rect><text class="valueLabel" x="${x+w/2}" y="${Math.max(18,y-15)}" text-anchor="middle">${formatGraphValue(v,format)}</text>${showShare&&format!=='percent'?`<text x="${x+w/2}" y="${Math.max(31,y-2)}" text-anchor="middle" font-size="10">${pct(share)}</text>`:''}<text x="${x+w/2}" y="${H-22}" text-anchor="middle" font-size="10" transform="rotate(-28 ${x+w/2} ${H-22})">${escapeHtml(r[labelKey])}</text>`});return svg+'</svg>'}
function horizontalBars(rows,opts={}){const max=Math.max(1,...rows.map(r=>r.value)),total=opts.total??rows.reduce((s,r)=>s+r.value,0),format=opts.format||'yen';return rows.map(r=>{const share=total?r.value/total:0;return `<div class="metric"><span style="width:31%;overflow:hidden;text-overflow:ellipsis" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</span><div style="width:39%" class="barbg"><div class="barfill" style="width:${r.value/max*100}%"></div></div><b style="width:30%;text-align:right">${formatGraphValue(r.value,format)} <span class="shareText">${pct(share)}</span></b></div>`}).join('')}
function donutSvg(parts){const total=parts.reduce((s,x)=>s+x.value,0)||1;let start=-Math.PI/2;const colors=['#4472c4','#ed7d31','#ffc000','#70ad47','#a5a5a5','#5b9bd5'];let paths='';parts.forEach((x,i)=>{const a=x.value/total*Math.PI*2,end=start+a,r=105,cx=160,cy=145,x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end),large=a>Math.PI?1:0,mid=start+a/2,lx=cx+76*Math.cos(mid),ly=cy+76*Math.sin(mid);paths+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}"><title>${x.label} ${yen(x.value)} ${pct(x.value/total)}</title></path>${x.value/total>=.045?`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" font-weight="700" fill="white">${pct(x.value/total)}</text>`:''}`;start=end});return `<svg viewBox="0 0 650 310"><g>${paths}<circle cx="160" cy="145" r="58" fill="white"/><text x="160" y="138" text-anchor="middle" font-size="14">合計</text><text x="160" y="163" text-anchor="middle" font-size="17" font-weight="700">${yen(total)}</text></g>${parts.map((x,i)=>`<g transform="translate(330,${35+i*48})"><rect width="13" height="13" fill="${colors[i%colors.length]}"/><text x="22" y="12" font-size="14">${x.label}</text><text x="22" y="31" font-size="13">${yen(x.value)}／${pct(x.value/total)}</text></g>`).join('')}</svg>`}
function chartDetailTable(headers,rows){return `<div class="chartDetails">${table(headers,rows,true)}</div>`}
function periodParts(){const m={昼:0,夜:0,深夜:0,その他:0};state.hourly.forEach(r=>m[r.period||'その他']=(m[r.period||'その他']||0)+(+r.sales||0));return [['昼（10:00〜17:59）',m['昼']||0],['夜（18:00〜23:59）',m['夜']||0],['深夜（0:00〜2:59）',m['深夜']||0],['その他（3:00〜9:59）',m['その他']||0]].map(x=>({label:x[0],value:x[1]}))}
function detailCategory(name,base){if(/ビール|コーラ|ジュース|酒|ハイボール|サワー/.test(name))return'飲料';if(/セット/.test(name))return'セット';if(/味噌/.test(name))return'ラーメン・味噌';if(/醤油/.test(name))return'ラーメン・醤油';if(/塩/.test(name))return'ラーメン・塩';if(/餃子/.test(name))return'サイド・餃子';if(/ご飯|ライス|丼/.test(name))return'ご飯・丼';if(/チャーシュー|メンマ|ネギ|玉子|バター|コーン/.test(name))return'追加・トッピング';return base||'その他'}
function renderOverview(){const label=scopeLabel(),productTotal=state.products.reduce((s,x)=>s+x.sales,0),hourTotal=state.hourly.reduce((s,x)=>s+x.sales,0),dailyTotal=state.daily.reduce((s,x)=>s+x.total_sales,0);const top=state.products.slice(0,10).map(x=>({label:x.name,value:x.sales}));const cats={};state.products.forEach(x=>{const k=detailCategory(x.name,x.category);cats[k]=(cats[k]||0)+x.sales});const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(x=>({label:x[0],value:x[1]}));const period=periodParts();const operating=state.daily.filter(x=>x.total_sales>0);const best=[...operating].sort((a,b)=>b.total_sales-a.total_sales)[0],weak=[...operating].sort((a,b)=>a.total_sales-b.total_sales)[0];const beer=state.products.filter(x=>/ビール/.test(x.name)).reduce((s,x)=>s+x.sales,0);const night=period[1].value+period[2].value,total=period.reduce((s,x)=>s+x.value,0);const dailyDetail=state.daily.map(r=>[r.business_date,yen(r.total_sales),pct(dailyTotal?r.total_sales/dailyTotal:0),r.customers+'人',yen(r.avg_spend)]);const monthRows=state.monthly.map(r=>({label:ymLabel(r.month),value:r.sales}));$('host').innerHTML=`<div class="notice ok" style="margin-bottom:12px"><b>${label}表示</b>　すべてのグラフに実数・単位・構成比を表示しています。</div><div class="grid2"><div class="panel chart"><h3>${label} 日別売上推移</h3>${graphMeta('円','点の上＝売上額／明細＝期間内構成比')}${lineSvg(state.daily)}${chartDetailTable(['日付','売上','期間内構成比','客数','客単価'],dailyDetail)}</div><div class="panel chart"><h3>月別売上比較</h3>${graphMeta('円・%','棒の上＝売上額／下段＝累計構成比')}${barSvg(monthRows,'label','value',{total:state.monthly.reduce((s,x)=>s+x.sales,0)})}${chartDetailTable(['月','売上','累計構成比'],state.monthly.map(r=>[ymLabel(r.month),yen(r.sales),pct(state.overview.total_sales?r.sales/state.overview.total_sales:0)]))}</div><div class="panel chart"><h3>${label} 昼・夜・深夜 売上構成</h3>${graphMeta('円・%','円内と凡例に構成比を表示')}${donutSvg(period)}</div><div class="panel"><h3>${label} 商品売上 上位10</h3>${graphMeta('円・%','右側に売上額と商品売上内構成比')}${horizontalBars(top,{total:productTotal})}</di
