<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>味一番つばさ 簡易シフト表</title><style>:root{--nav:#15395b;--line:#d7e1ec;--bg:#f4f7fb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:#1f2937}header{background:var(--nav);color:#fff;padding:12px 14px}header h1{font-size:18px;margin:0 0 8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit}button{border:0;border-radius:8px;padding:9px 12px;background:#fff;color:var(--nav);font-weight:700}button.primary{background:#f4b400;color:#111}main{max-width:1500px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#f8fbff;border:1px solid #dbe7f3;border-radius:10px;padding:10px}.kpi .v{font-size:22px;font-weight:800;color:var(--nav)}.kpi .s{font-size:12px;color:var(--muted)}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:center}th{background:#eaf2fb;color:#17365d;font-size:12px}th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:145px;text-align:left}.staffName{font-weight:800}.staffMeta{font-size:11px;color:var(--muted)}.shiftBtn{width:92px;min-height:40px;border:1px solid #c9d6e4;border-radius:8px;background:#fff;font-weight:800;color:#17365d}.shiftBtn.off{background:#f0f0f0;color:#777}.shiftBtn.night{background:#eef0ff}.shiftBtn.peak{background:#fff0f0}.totalCell{font-weight:800;background:#f8fbff}.notice{padding:10px;border-radius:8px;background:#fff7e6;border-left:5px solid #ef9f27}.settings{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}.settings input,.settings select{padding:8px;border:1px solid var(--line);border-radius:7px;width:100%}.modal{display:none;position:fixed;inset:0;z-index:99;background:#0008;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalCard{width:min(560px,96vw);background:#fff;border-radius:16px;padding:14px}.modalTitle{font-size:18px;font-weight:900;color:#17365d}.modalSub{font-size:13px;color:#6b7280;margin:5px 0 10px}.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quickBtn{min-height:65px;border:2px solid #d7e1ec;border-radius:10px;background:#f8fbff;color:#17365d;font-size:16px;font-weight:900}.quickBtn.red{background:#fff0f0;color:#9b1c1c}.quickBtn.green{background:#eef9ef;color:#216e27}.quickBtn.purple{background:#f2efff;color:#4f46a5}.customBox{margin-top:12px}.timeRow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}.timeRow select{padding:10px;border:1px solid #cbd5e1;border-radius:9px}.modalActions{display:flex;gap:8px;margin-top:12px}.modalActions button{flex:1;background:#17365d;color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>味一番つばさ｜簡易シフト表</h1><div class="toolbar"><button id="prev">←前月</button><select id="month"></select><button id="next">次月→</button><button class="primary" id="save">保存</button><button id="export">CSV出力</button><button id="print">印刷</button></div></header><main><div class="card"><div class="grid"><div class="kpi"><div class="s">バイト予定時間</div><div class="v" id="ptHours">0h</div></div><div class="kpi"><div class="s">バイト概算給与</div><div class="v" id="ptCost">¥0</div></div><div class="kpi"><div class="s">22時以降の深夜時間</div><div class="v" id="nightHours">0h</div></div><div class="kpi"><div class="s">警告件数</div><div class="v" id="warnings">0</div></div></div></div><div class="card"><div class="notice">マスを押して「昼・夜・深夜・休み」を選ぶだけ。植山＝夜メイン、中山＝昼＋必要時夜ヘルプ、東出＝夜不可。</div></div><div class="card"><h3>スタッフ設定</h3><div id="staffSettings"></div><button id="addStaff">＋スタッフ追加</button></div><div class="card"><div class="tableWrap"><table id="shiftTable"></table></div></div></main><div id="shiftModal" class="modal"><div class="modalCard"><div class="modalTitle" id="modalTitle">勤務時間を選ぶ</div><div class="modalSub">基本は4つのボタンだけです。</div><div class="quickGrid" id="quickGrid"><button class="quickBtn green" data-shift="11-18">☀ 昼<br><small>11〜18</small></button><button class="quickBtn" data-shift="18-23">🌆 夜<br><small>18〜23</small></button><button class="quickBtn purple" data-shift="20-2">🌙 深夜<br><small>20〜2</small></button><button class="quickBtn red" data-shift="休">休み</button></div><button id="advancedToggle" style="width:100%;margin-top:12px;background:#eef2f7">時間を細かく変える</button><div class="customBox" id="customBox" style="display:none"><div class="timeRow"><select id="startTime"></select><span>〜</span><select id="endTime"></select></div><div class="modalActions"><button id="applyCustom">決定</button><button id="clearShift">空欄</button><button id="closeModal">閉じる</button></div></div></div></div><script>const STORE='tsubasa_shift_public_v1',dow=['日','月','火','水','木','金','土'];const mk=()=>Math.random().toString(36).slice(2)+Date.now();const defaultStaff=[{id:mk(),name:'植山',type:'社員',hourly:0,group:'夜メイン'},{id:mk(),name:'中山',type:'社員',hourly:0,group:'昼・夜ヘルプ'},{id:mk(),name:'東出',type:'社員',hourly:0,group:'昼のみ'},{id:mk(),name:'バイトA',type:'バイト',hourly:1100,group:'終電組'},{id:mk(),name:'バイトB',type:'バイト',hourly:1100,group:'深夜組'},{id:mk(),name:'バイトC',type:'バイト',hourly:1100,group:'ピーク補助'}];let state={staff:defaultStaff,shifts:{},month:'2026-09'},ctx=null;function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x)state=x}catch(e){}}function save(){localStorage.setItem(STORE,JSON.stringify(state));save.textContent='保存済み✓';setTimeout(()=>save.textContent='保存',800)}function parts(){return state.month.split('-').map(Number)}function days(){let[y,m]=parts();return new Date(y,m,0).getDate()}function key(d){return state.month+'-'+String(d).padStart(2,'0')}function parse(v){v=(v||'').replace(/〜|～/g,'-');if(!v||v==='休'||v==='○')return null;let m=v.match(/^(\d{1,2})(?::(\d{2}))?-(\d{1,2})(?::(\d{2}))?$/);if(!m)return null;let s=+m[1]+(+m[2]||0)/60,e=+m[3]+(+m[4]||0)/60;if(e<=s)e+=24;return{s,e,h:e-s}}function nh(p){if(!p)return 0;let a=Math.max(p.s,22),b=Math.min(p.e,29);return Math.max(0,b-a)}function cost(s,v){let p=parse(v);if(s.type!=='バイト'||!p)return 0;let n=nh(p);return(p.h-n)*s.hourly+n*s.hourly*1.25}function opts(){month.innerHTML='';for(let y=2026;y<=2027;y++)for(let m=1;m<=12;m++){let v=y+'-'+String(m).padStart(2,'0'),o=document.createElement('option');o.value=v;o.textContent=y+'年'+m+'月';month.append(o)}month.value=state.month}function settings(){staffSettings.innerHTML='';state.staff.forEach((s,i)=>{let r=document.createElement('div');r.className='settings';r.innerHTML=`<input value="${s.name}" data-k="name" data-i="${i}"><select data-k="type" data-i="${i}"><option ${s.type==='社員'?'selected':''}>社員</option><option ${s.type==='バイト'?'selected':''}>バイト</option></select><input type="number" value="${s.hourly||0}" data-k="hourly" data-i="${i}"><input value="${s.group||''}" data-k="group" data-i="${i}"><button data-del="${i}">削除</button>`;staffSettings.append(r)});document.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{let i=+e.dataset.i,k=e.dataset.k;state.staff[i][k]=k==='hourly'?+e.value:e.value;save();render()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{state.staff.splice(+e.dataset.del,1);save();render()})}function cls(v){let p=parse(v);if(v==='休')return'off';if(!p)return'';if(p.e>24)return'night';if(p.s<=20&&p.e>=23)return'peak';return''}function table(){shiftTable.innerHTML='';let n=days(),[y,m]=parts(),h='<thead><tr><th>スタッフ</th>';for(let d=1;d<=n;d++){let w=new Date(y,m-1,d).getDay();h+=`<th>${d}<br>${dow[w]}</th>`}h+='<th>月計</th></tr></thead>';shiftTable.insertAdjacentHTML('beforeend',h);let b=document.createElement('tbody');state.staff.forEach(s=>{let r=document.createElement('tr');r.innerHTML=`<td><div class="staffName">${s.name}</div><div class="staffMeta">${s.type}｜${s.group||''}${s.type==='バイト'?'｜¥'+s.hourly:''}</div></td>`;let total=0;for(let d=1;d<=n;d++){let k=key(d),v=(state.shifts[k]||{})[s.id]||'',p=parse(v);if(p)total+=p.h;let td=document.createElement('td'),bt=document.createElement('button');bt.className='shiftBtn '+cls(v);bt.textContent=v||'選ぶ';bt.onclick=()=>open(k,s.id,s.name,d,v);td.append(bt);r.append(td)}let t=document.createElement('td');t.className='totalCell';t.textContent=total?total.toFixed(1)+'h':'-';r.append(t);b.append(r)});shiftTable.append(b)}function kpis(){let ph=0,pc=0,n=0,w=0;for(let d=1;d<=days();d++)for(let s of state.staff){let v=(state.shifts[key(d)]||{})[s.id]||'',p=parse(v);if(p){if(s.type==='バイト'){ph+=p.h;pc+=cost(s,v);n+=nh(p)}if(p.h>8)w++;if(s.name.includes('東出')&&(p.e>18||p.s>=18))w++}}ptHours.textContent=ph.toFixed(1)+'h';ptCost.textContent='¥'+Math.round(pc).toLocaleString();nightHours.textContent=n.toFixed(1)+'h';warnings.textContent=w}function render(){opts();settings();table();kpis()}function fill(){if(startTime.options.length)return;for(let h=0;h<24;h++)for(let mm of [0,30]){let v=mm?h+':30':String(h);for(let el of [startTime,endTime]){let o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}}}function open(k,id,name,d,v){fill();ctx={k,id};modalTitle.textContent=d+'日｜'+name;startTime.value='18';endTime.value='23';shiftModal.classList.add('open')}function set(v){state.shifts[ctx.k]||={};state.shifts[ctx.k][ctx.id]=v;save();shiftModal.classList.remove('open');ctx=null;table();kpis()}document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>set(b.dataset.shift));advancedToggle.onclick=()=>customBox.style.display=customBox.style.display==='none'?'block':'none';applyCustom.onclick=()=>set(startTime.value+'-'+endTime.value);clearShift.onclick=()=>set('');closeModal.onclick=()=>shiftModal.classList.remove('open');prev.onclick=()=>{let[y,m]=parts();m--;if(m<1){m=12;y--}state.month=y+'-'+String(m).padStart(2,'0');save();render()};next.onclick=()=>{let[y,m]=parts();m++;if(m>12){m=1;y++}state.month=y+'-'+String(m).padStart(2,'0');save();render()};month.onchange=e=>{state.month=e.target.value;save();render()};print.onclick=()=>window.print();export.onclick=()=>alert('CSV出力は次版で追加');addStaff.onclick=()=>{state.staff.push({id:mk(),name:'新規',type:'バイト',hourly:1100,group:''});save();render()};load();render();</script></body></html>
