name: Pro-independent systems audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-pro-independence.mjs'
      - '.github/workflows/pro-independence-audit.yml'
      - 'site-manifest.json'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public systems and dependencies
        run: node scripts/verify-pro-independence.mjs
      - name: Publish readable summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const path = 'audit-output/pro-independence-latest.json';
          if (!fs.existsSync(path)) {
            console.log('# Pro-independent systems audit\n\nNo report was generated.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`# Pro-independent systems audit: ${report.overall}`);
          console.log(`\nGenerated: ${report.generatedAtUtc}\n`);
          console.log('| Check | Level | Status |');
          console.log('|---|---|---|');
          for (const item of report.results) console.log(`| ${item.id} | ${item.level} | ${item.status} |`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-independence-audit-${{ github.run_number }}
          path: audit-output/pro-independence-latest.json
          retention-days: 90
          if-no-files-found: warn
