name: Rev2 Hotfix Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages-rev2/**'
      - '.github/workflows/rev2-hotfix-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject holiday labels script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pages-rev2/index.html')
          html = path.read_text(encoding='utf-8')
          script = '<script src="./holiday-enhancements.js?v=20260803-hotfix"></script>'
          import re
          html = re.sub(r'<script src="\./holiday-enhancements\.js\?v=[^"]+"></script>', '', html)
          html = html.replace('</body>', script + '</body>')
          path.write_text(html, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-rev2
      - id: deployment
        uses: actions/deploy-pages@v4
