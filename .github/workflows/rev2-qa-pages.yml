name: Rev2 Autonomous QA and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop/rev2, main]
    paths:
      - 'pages-rev2/**'
      - 'tests/e2e/pages-rev2.spec.ts'
      - 'playwright.pages.config.ts'
      - '.github/workflows/rev2-qa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rev2-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployable site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('pages-rev2')
          index = root / 'index.html'
          holiday = root / 'holiday-enhancements.js'
          fl = root / 'fl-dashboard.js'
          fresh = root / 'fresh-supabase.js'
          config = root / 'site-config.js'
          if not index.exists() or not holiday.exists() or not fl.exists() or not fresh.exists() or not config.exists():
            raise SystemExit('Required Pages files are missing')

          html = index.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\./holiday-enhancements\.js\?v=[^"]+"></script>', '', html)
          html = re.sub(r'<script src="\./fl-dashboard\.js\?v=[^"]+"></script>', '', html)
          html = re.sub(r'<script src="\./fresh-supabase\.js\?v=[^"]+"></script>', '', html)
          html = re.sub(
              r'(<script src="\./rev2-data\.js\?v=[^"]+"></script>)',
              '<script src="./fresh-supabase.js?v=${{ github.sha }}"></script>\\n\\1',
              html,
              count=1
          )
          scripts = '\n'.join([
              '<script src="./holiday-enhancements.js?v=${{ github.sha }}"></script>',
              '<script src="./fl-dashboard.js?v=${{ github.sha }}"></script>'
          ])
          html = html.replace('</body>', scripts + '\n</body>')
          index.write_text(html, encoding='utf-8')

          js = holiday.read_text(encoding='utf-8')
          for required in ('2026-08-11', '山の日', 'WEEKDAYS', 'compactDate'):
              if required not in js:
                  raise SystemExit(f'Holiday enhancement is incomplete: {required}')
          fl_js = fl.read_text(encoding='utf-8')
          for required in ('F/L・FLR 経営指標', '__TSUBASA_FL_DIRECT__', '累計 F/L比率', '累計 FLR比率', 'FLR率'):
              if required not in fl_js:
                  raise SystemExit(f'F/L・FLR dashboard is incomplete: {required}')
          fresh_js = fresh.read_text(encoding='utf-8')
          for required in ('cache: "no-store"', 'order", "id.asc"', '__TSUBASA_FRESH_SUPABASE__'):
              if required not in fresh_js:
                  raise SystemExit(f'Fresh Supabase patch is incomplete: {required}')
          PY
      - name: Static smoke check
        run: |
          node --check pages-rev2/holiday-enhancements.js
          node --check pages-rev2/fl-dashboard.js
          node --check pages-rev2/fresh-supabase.js
          node --check pages-rev2/site-config.js
          grep -q 'site-config.js' pages-rev2/index.html
          grep -q 'fresh-supabase.js' pages-rev2/index.html
          grep -q 'holiday-enhancements.js' pages-rev2/index.html
          grep -q 'fl-dashboard.js' pages-rev2/index.html
          grep -q 'F/L・FLR 経営指標' pages-rev2/fl-dashboard.js
          grep -q '累計 FLR比率' pages-rev2/fl-dashboard.js
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: pages-rev2

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the actual public site
        env:
          SITE_URL: https://infoworks-jp.github.io/tsubasa-business-system-codex/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            html="$(curl -fsSL --max-time 20 "${SITE_URL}?verify=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -q 'fresh-supabase.js' && printf '%s' "$html" | grep -q 'holiday-enhancements.js' && printf '%s' "$html" | grep -q 'fl-dashboard.js'; then
              fresh_js="$(curl -fsSL --max-time 20 "${SITE_URL}fresh-supabase.js?verify=${GITHUB_SHA}" || true)"
              holiday_js="$(curl -fsSL --max-time 20 "${SITE_URL}holiday-enhancements.js?verify=${GITHUB_SHA}" || true)"
              fl_js="$(curl -fsSL --max-time 20 "${SITE_URL}fl-dashboard.js?verify=${GITHUB_SHA}" || true)"
              if printf '%s' "$fresh_js" | grep -q '__TSUBASA_FRESH_SUPABASE__' && printf '%s' "$holiday_js" | grep -q '山の日' && printf '%s' "$fl_js" | grep -q 'F/L・FLR 経営指標' && printf '%s' "$fl_js" | grep -q '累計 FLR比率' && printf '%s' "$fl_js" | grep -q '__TSUBASA_FL_DIRECT__'; then
                echo "Public F/L・FLR verification passed: ${SITE_URL}"
                exit 0
              fi
            fi
            echo "Public site not updated yet (attempt ${attempt}/30)"
            sleep 10
          done
          echo 'Public F/L・FLR verification failed after 5 minutes'
          exit 1

  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start static app
        run: python3 -m http.server 4173 --directory pages-rev2 &
      - name: Playwright QA
        env:
          SUPABASE_ADMIN_JWT: ${{ secrets.SUPABASE_ADMIN_JWT || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec playwright test --config=playwright.pages.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rev2-playwright-evidence-${{ github.run_number }}
          path: |
            playwright-report
            test-results/pages-rev2
          retention-days: 30
