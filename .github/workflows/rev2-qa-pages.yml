name: Rev2 Autonomous QA and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop/rev2, main]
    paths:
      - 'pages-rev2/**'
      - 'tests/e2e/pages-rev2.spec.ts'
      - 'playwright.pages.config.ts'
      - '.github/workflows/rev2-qa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rev2-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployable site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('pages-rev2')
          index = root / 'index.html'
          holiday = root / 'holiday-enhancements.js'
          if not index.exists() or not holiday.exists():
              raise SystemExit('Required Pages files are missing')

          html = index.read_text(encoding='utf-8')
          html = re.sub(r'<script src="\./holiday-enhancements\.js\?v=[^"]+"></script>', '', html)
          script = '<script src="./holiday-enhancements.js?v=${{ github.sha }}"></script>'
          html = html.replace('</body>', script + '\n</body>')
          index.write_text(html, encoding='utf-8')

          js = holiday.read_text(encoding='utf-8')
          for required in ('2026-08-11', '山の日', 'WEEKDAYS', 'compactDate'):
              if required not in js:
                  raise SystemExit(f'Holiday enhancement is incomplete: {required}')
          PY
      - name: Static smoke check
        run: |
          node --check pages-rev2/holiday-enhancements.js
          grep -q 'holiday-enhancements.js' pages-rev2/index.html
          grep -q '山の日' pages-rev2/holiday-enhancements.js
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: pages-rev2

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the actual public site
        env:
          SITE_URL: https://infoworks-jp.github.io/tsubasa-business-system-codex/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            html="$(curl -fsSL --max-time 20 "${SITE_URL}?verify=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -q 'holiday-enhancements.js'; then
              js_url="${SITE_URL}holiday-enhancements.js?verify=${GITHUB_SHA}"
              js="$(curl -fsSL --max-time 20 "$js_url" || true)"
              if printf '%s' "$js" | grep -q '山の日' && printf '%s' "$js" | grep -q 'WEEKDAYS'; then
                echo "Public verification passed: ${SITE_URL}"
                exit 0
              fi
            fi
            echo "Public site not updated yet (attempt ${attempt}/30)"
            sleep 10
          done
          echo 'Public verification failed after 5 minutes'
          exit 1

  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start static app
        run: python3 -m http.server 4173 --directory pages-rev2 &
      - name: Playwright QA
        env:
          SUPABASE_ADMIN_JWT: ${{ secrets.SUPABASE_ADMIN_JWT || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec playwright test --config=playwright.pages.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rev2-playwright-evidence-${{ github.run_number }}
          path: |
            playwright-report
            test-results/pages-rev2
          retention-days: 30
